function findBlock(sid,bid){
  if(sid==='ficha')return {s:null,b:S.data.proyectos.find(x=>x.id===bid)};
  if(S.live&&(sid==='live'||sid===S.live.id))return {s:S.live,b:S.live.bloques.find(x=>x.id===bid),live:true};
  const s=S.data.sesiones.find(x=>x.id===sid);return {s,b:s&&(s.bloques||[]).find(x=>x.id===bid)};
}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const M=1600,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  }finally{URL.revokeObjectURL(url)}
}
async function setFoto(sid,bid,fotoId){
  const f=findBlock(sid,bid);if(!f.b)return false;
  if(sid==='ficha')return await dbUpdate('proyectos',bid,{foto:fotoId,auto:false,updatedAt:Date.now()});
  if(f.live){f.b.foto=fotoId;if(F&&F._kind==='liveblock'&&F.b.id===bid)F.b.foto=fotoId;persistLive(true);await wq;return true}
  const bl=clone(f.s.bloques||[]),b=bl.find(x=>x.id===bid);b.foto=fotoId;
  return await dbUpdate('sesiones',f.s.id,{bloques:bl,updatedAt:Date.now()});
}
/* una foto puede estar compartida entre un bloque y su ficha: solo se borra del almacén si nada más la usa */
function fotoUsed(id,ex){if(!id)return false;const L=(ex||[]).map(([a,b])=>[a==='live'&&S.live?S.live.id:a,b]),isEx=(a,b)=>L.some(x=>x[0]===a&&x[1]===b);
  for(const x of allBlocks())if(x.b.foto===id&&!isEx(x.s.id,x.b.id))return true;
  for(const p of S.data.proyectos.concat(S.fusionadas||[]))if(p.foto===id&&!isEx('ficha',p.id))return true;return false}
function repaintAfterPhoto(){render();if(F){if(F._kind==='liveblock')paintLiveBlock();else if(F._kind==='mem')paintMem()}}
/* si la ficha vinculada mostraba exactamente la foto antigua del bloque, la ficha sigue al bloque */
async function syncFichaFoto(pid,old,nuevo){const p=pid&&S.data.proyectos.find(x=>x.id===pid);
  return !(p&&old&&p.foto===old)||await dbUpdate('proyectos',pid,{foto:nuevo,updatedAt:Date.now()})}
async function attachPhoto(sid,bid,file){
  if(!S.assets){toast('Las fotos no están disponibles en esta vista.');return}
  toast('Subiendo foto…');
  let blob=null;try{blob=await shrink(file)}catch(e){}
  if(!blob){if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)&&file.size<20e6)blob=file;else{toast('No puedo leer esta imagen. Prueba con una JPG o PNG.');return}}
  let r;try{r=await S.assets.upload(blob,{type:blob.type||'image/jpeg'})}
  catch(e){const c=e&&e.code;toast(c==='too_large'?'La foto es demasiado grande.':c==='quota_or_state'?'No queda espacio para más fotos.':c==='rate_limited'?'Espera un momento y vuelve a probar.':'No se pudo subir la foto ('+(c||'error')+').');return}
  const bb=findBlock(sid,bid).b,old=bb?.foto,pid=sid==='ficha'?null:bb?.proyectoId;
  if(await setFoto(sid,bid,r.id)){toast('Foto guardada');const sy=await syncFichaFoto(pid,old,r.id);if(sy&&old&&old!==r.id&&!fotoUsed(old,[[sid,bid],['ficha',pid]]))S.assets.delete(old).catch(()=>{});repaintAfterPhoto()}
  else S.assets.delete(r.id).catch(()=>{});
}
async function removePhoto(sid,bid){const bb=findBlock(sid,bid).b,old=bb?.foto,pid=sid==='ficha'?null:bb?.proyectoId;if(!old)return;
  if(await setFoto(sid,bid,'')){const sy=await syncFichaFoto(pid,old,'');if(sy&&!fotoUsed(old,[[sid,bid],['ficha',pid]]))S.assets?.delete(old).catch(()=>{});toast('Foto quitada');repaintAfterPhoto()}}
/* quitar la foto que muestra una ficha: la quita de la ficha y de los bloques vinculados que la comparten, a la primera */
async function removeFichaPhoto(pid){
  const p=S.data.proyectos.find(x=>x.id===pid);if(!p)return;const items=fichaItems().get(pid)||[],old=projFoto(p,items);if(!old)return;
  const ex=[['ficha',pid]];let ok=true;
  if(p.foto===old)ok=await dbUpdate('proyectos',pid,{foto:'',auto:false,updatedAt:Date.now()});
  const bySes=new Map();for(const x of items)if(x.b.foto===old){(bySes.get(x.s.id)||bySes.set(x.s.id,{s:x.s,ids:[]}).get(x.s.id)).ids.push(x.b.id);ex.push([x.s.id,x.b.id])}

  if(ok){if(!fotoUsed(old,ex))S.assets?.delete(old).catch(()=>{});toast('Foto quitada');repaintAfterPhoto()}}

const sbl=s=>(S.live&&s.id===S.live.id)?S.live.bloques:(s.bloques||[]);

function allBlocks(){const out=[];for(const s of S.data.sesiones)for(const b of sbl(s))out.push({s,b,fecha:s.fecha,sid:s.id});return out}

const fichaThumb=(p,FI)=>{const f=projFoto(p,FI&&FI.get(p.id));return f?`<img class="thumb" src="${fotoUrl(f)}" data-foto="1" alt="">`:sw(p.hex)};

function weeklyChart(){
  const t=today(),wk=[],cs=mainGym().colores;
  for(let w=11;w>=0;w--){const m=addDays(monday(t),-7*w),e=addDays(m,7);const b=ses().filter(s=>s.fecha>=m&&s.fecha<e).flatMap(s=>(s.bloques||[]).filter(x=>x.resultado).map(x=>({...x,rocodromoId:x.rocodromoId||s.rocodromoId})));
    const tp=b.filter(isTop).map(cidx);wk.push({m,n:b.length,t:tp.length,max:tp.length?Math.max(...tp):null})}
  const vals=wk.map(w=>w.max).filter(v=>v!==null);if(!vals.length)return '<p class="muted">Aún no hay semanas con tops.</p>';
  const W=640,H=230,L=92,R=12,T=16,B=58,iw=W-L-R,ih=H-T-B,lo=Math.max(0,Math.min(...vals)-1),hi=Math.min(cs.length-1,Math.max(...vals)+1);
  const x=i=>L+iw*(i+.5)/12,y=v=>T+ih-(v-lo)/(hi-lo||1)*ih,nmax=Math.max(1,...wk.map(w=>w.n)),vb=34;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Color máximo encadenado y volumen por semana">`;
  for(let g=lo;g<=hi;g++)s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" opacity=".6"/><circle cx="10" cy="${y(g)}" r="6" style="fill:${esc(cs[g].hex)};stroke:var(--line)"/><text class="lbc" x="22" y="${y(g)+4}">${esc(cs[g].n)}</text>`;
  wk.forEach((w,i)=>{const bh=w.n/nmax*vb,bw=iw/12*.55;s+=`<rect class="vb" x="${x(i)-bw/2}" y="${H-22-bh}" width="${bw}" height="${bh}" rx="2"/><rect class="vb2" x="${x(i)-bw/2}" y="${H-22-w.t/nmax*vb}" width="${bw}" height="${w.t/nmax*vb}" rx="2"/>`;
    if(i%2===1){const d=pdate(w.m);s+=`<text class="lbl" x="${x(i)}" y="${H-6}" text-anchor="middle">${d.getDate()} ${MES[d.getMonth()]}</text>`}});
  const pts=wk.map((w,i)=>w.max!==null?[x(i),y(w.max)]:null).filter(Boolean);
  if(pts.length>1)s+=`<path class="ar" d="M${pts[0][0]},${T+ih} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${T+ih}Z"/><path class="ln" d="M${pts.map(p=>p.join(',')).join(' L')}"/>`;
  pts.forEach((p,i)=>s+=`<circle class="dot ${i===pts.length-1?'end':''}" cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}"/>`);
  return s+'</svg><div class="legend" style="margin-top:6px"><span style="--c:var(--accent)">Color máximo encadenado</span><span style="--c:var(--sunk)">Bloques probados</span><span style="--c:color-mix(in srgb,var(--accent) 75%,transparent)">Tops</span></div>';
}

function md(t){const lines=esc(t).split('\n');let h='',list=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  for(const raw of lines){const l=raw.trim();let m;
    if(!l){close();continue}
    if(m=l.match(/^#{1,2}\s+(.*)/)){close();h+=`<h3>${inl(m[1])}</h3>`;continue}
    if(m=l.match(/^#{3,6}\s+(.*)/)){close();h+=`<h4>${inl(m[1])}</h4>`;continue}
    if(m=l.match(/^[-*•]\s+(.*)/)){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${inl(m[1])}</li>`;continue}
    if(m=l.match(/^\d+[.)]\s+(.*)/)){if(list!=='ol'){close();h+='<ol>';list='ol'}h+=`<li>${inl(m[1])}</li>`;continue}
    close();h+=`<p>${inl(l)}</p>`}
  close();return h}

async function ensureFichas(bloques,fecha,gid,opts={}){
  if(!S.db)return 0;let n=0;redirFusionadas(bloques);const ex=new Set(S.data.proyectos.map(p=>p.id)),loaded=S.got&&S.got.has('proyectos')&&(S.proyN||0)<1000;
  for(const b of bloques){if(!b.resultado||b.resultado==='flash')continue;
    if(b.proyectoId&&(!loaded||ex.has(b.proyectoId)||CREATED.has(b.proyectoId)))continue;
    try{const ref=S.db.collection('proyectos').doc();await ref.set(fichaFromBlock(b,fecha,gid));b.proyectoId=ref.id;CREATED.add(ref.id);n++;
      if(opts.created)opts.created.push(ref.id);const m=opts.mirror&&opts.mirror.find(x=>x.id===b.id);if(m)m.proyectoId=ref.id}catch(e){}}

/* borra fichas automáticas (auto:true, nunca editadas a mano) que se quedan sin ningún bloque vinculado.
   known=true: ids recién creados por nosotros, aunque aún no hayan llegado a S.data */
async function pruneFichas(ids,sid,keep,known){
  try{const used=new Set((keep||[]).map(b=>b.proyectoId).filter(Boolean));
    for(const x of allBlocks())if(x.s.id!==sid&&x.b.proyectoId)used.add(x.b.proyectoId);
    for(const id of new Set(ids)){if(used.has(id))continue;const p=S.data.proyectos.find(x=>x.id===id);
      if(p?(fichaAuto(p)&&(p.estado==='activo'||p.estado==='encadenado')):known)await S.db.doc('proyectos/'+id).delete()}}
  catch(e){}}

/* campos opcionales del cierre: si no se rellenan no se guardan (nunca undefined en la base) */
function cleanCierre(d){
  const n=(v,lo,hi)=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)&&x>lo&&x<=hi?x:null};
  if('suenoH' in d){const v=n(d.suenoH,0,24);if(v===null)delete d.suenoH;else d.suenoH=v}
  if('peso' in d){const v=n(d.peso,20,300);if(v===null)delete d.peso;else d.peso=v}

  if(typeof d.calentN!=='number')delete d.calentN;
}

/* ================= temporizador de intervalos ================= */
const T={cfg:{...PRESETS[0]},preset:'rep',running:false,paused:false,plan:[],idx:0,end:0,rem:0,lastSec:null};
function buildPlan(c){const p=[{k:'prep',d:5}];
  for(let s=1;s<=c.sets;s++){for(let r=1;r<=c.reps;r++){if(c.work>0)p.push({k:'work',d:c.work,r,s});if(c.rest>0&&(r<c.reps||(c.setRest===0&&s<c.sets)||c.work===0))p.push({k:'rest',d:c.rest,r,s})}
    if(s<c.sets&&c.setRest>0)p.push({k:'setrest',d:c.setRest,s})}
  return p.filter(x=>x.d>0)}
const PH={prep:'Prepárate',work:'¡Dale!',rest:'Descansa',setrest:'Pausa entre series',done:'Terminado'};
function openTimer(){F={_kind:'timer'};paintTimer()}
function paintTimer(){const c=T.cfg,ph=(T.running||T.paused)?T.plan[T.idx]:null,total=buildPlan(c).reduce((a,x)=>a+x.d,0);
  setSheet(`<div class="sheethead"><h2>Temporizador</h2><button class="btn ghost" data-act="close">Cerrar</button></div>
  <div class="stack">
   ${ph?`<div class="tmr ${ph.k}"><div class="ph" id="tmrPh">${PH[ph.k]}</div><div class="big" id="tmrBig">${Math.ceil(T.rem/1000)}</div>
     <div class="num muted">${ph.r&&c.reps>1?`rep ${ph.r}/${c.reps} · `:''}${ph.s?`serie ${ph.s}/${c.sets}`:''}</div></div>
     <div class="bigrow"><button class="act ${T.paused?'top':'no'}" data-act="tPause">${T.paused?'Seguir':'Pausa'}</button><button class="act no" data-act="tStop">Parar</button></div>`
   :`<div class="seg" role="group" aria-label="Plantillas">${PRESETS.map(p=>`<button data-preset="${p.id}" aria-pressed="${T.preset===p.id}">${esc(p.n)}</button>`).join('')}</div>
     <div class="fgrid">${[['work','Trabajo (s)'],['rest','Descanso (s)'],['reps','Repeticiones'],['sets','Series'],['setRest','Pausa entre series (s)']].map(([k,l])=>`<label class="field"><span>${l}</span><input type="number" inputmode="numeric" id="t_${k}" data-tcfg="${k}" value="${c[k]}"></label>`).join('')}</div>
     <div class="muted num">Duración total: ${fmtDur(total*1000)}</div>
     <button class="btn pri big" data-act="tStart">Empezar</button>
     <p class="muted sm" style="margin:0">Pita en los 3 últimos segundos de cada fase y al cambiar. Sube el volumen; la pantalla se mantiene encendida mientras corre.</p>`}
  </div>`)}
function tStart(){unlockAudio();T.plan=buildPlan(T.cfg);if(!T.plan.length)return;T.idx=0;T.running=true;T.paused=false;T.end=performance.now()+T.plan[0].d*1000;T.rem=T.plan[0].d*1000;T.lastSec=null;wake(true);beep(660,.12);paintTimer()}
function tStop(){T.running=false;T.paused=false;if(!S.live)wake(false);if(F&&F._kind==='timer')paintTimer()}
function tPause(){if(T.paused){T.end=performance.now()+T.rem;T.paused=false;T.running=true}else{T.rem=T.end-performance.now();T.paused=true;T.running=false}paintTimer()}
function tTick(){T.rem=T.end-performance.now();
  if(T.rem<=0){T.idx++;
    if(T.idx>=T.plan.length){T.running=false;beep(1046,.5);setTimeout(()=>beep(1318,.6,false),500);const p=document.getElementById('tmrPh'),b=document.getElementById('tmrBig');if(p)p.textContent=PH.done;if(b)b.textContent='✓';if(!S.live)wake(false);setTimeout(()=>{if(!T.running&&F&&F._kind==='timer')paintTimer()},2500);return}
    const nx=T.plan[T.idx];T.end=performance.now()+nx.d*1000;T.rem=nx.d*1000;T.lastSec=null;beep(nx.k==='work'?1046:660,.3);if(F&&F._kind==='timer')paintTimer();return}
  const sec=Math.ceil(T.rem/1000);if(sec!==T.lastSec){T.lastSec=sec;if(sec<=3&&sec>0)beep(880,.08,false)}
  const b=document.getElementById('tmrBig');if(b)b.textContent=sec}

/* Carga el vídeo y prepara un lienzo del tamaño del fotograma (máx. 960 px de ancho) */
async function videoCanvas(){
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=V.url;
  await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('decode'));setTimeout(()=>rej(new Error('timeout')),15000)});
  const W=Math.min(960,v.videoWidth||960),H=Math.round((v.videoHeight||540)*W/(v.videoWidth||960));
  const c=document.createElement('canvas');c.width=W;c.height=H;return {v,c,W,H,cx:c.getContext('2d')};
}
const toJpeg=c=>new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
async function grabFrames(n){
  const {v,c,W,H,cx}=await videoCanvas(),out=[];
  const a=Math.max(0.05,V.start),b=Math.max(a+0.1,Math.min(V.end,v.duration-0.05));
  for(let i=0;i<n;i++){const t=n===1?(a+b)/2:a+(b-a)*i/(n-1);await seekTo(v,t);cx.drawImage(v,0,0,W,H);
    const blob=await toJpeg(c);if(blob)out.push({t,blob,url:URL.createObjectURL(blob)})}
  return out;
}
async function firstFrameBlob(){
  const {v,c,W,H,cx}=await videoCanvas();
  await seekTo(v,Math.min(0.1,Math.max(0,(v.duration||1)-0.05)));cx.drawImage(v,0,0,W,H);
  return toJpeg(c)
}

const dmes=s=>{const d=pdate(s);return `${d.getDate()} ${MES[d.getMonth()]}`};

/* elementos de la lista: fichas (kind 'f') y bloques antiguos sueltos sin ficha (kind 'l'); nada se escribe al listar */
function bloqueItems(){
  const FI=fichaItems(),g=mainGym(),pset=new Set(S.data.proyectos.map(p=>p.id)),out=[];
  for(const p of S.data.proyectos){
    const a=FI.get(p.id)||[],ss=new Set();let att=0,last='';
    for(const x of a){att+=num(x.b.intentos,0);ss.add(x.s.id);if((x.fecha||'')>last)last=x.fecha||''}
    out.push({kind:'f',id:p.id,p,color:p.color,hex:p.hex,min:p.min,max:p.max,rocodromoId:p.rocodromoId||g.id,presas:p.presas||'',
      name:projName(p),unnamed:!(p.nombre&&String(p.nombre).trim()),foto:projFoto(p,a),att,sess:ss.size,sids:ss,last,
      estado:p.estado||'activo',principal:p.principal===true,created:p.createdAt||0,blocks:a})}
  for(const s of ses())for(const b of (s.bloques||[])){
    if(b.proyectoId&&(pset.has(b.proyectoId)||(S.proyN||0)>=1000))continue;   /* con el límite alcanzado, la ficha puede haber quedado fuera: no es un bloque suelto */
    if(!b.resultado&&!num(b.intentos,0))continue;
    out.push({kind:'l',id:'l:'+s.id+'|'+b.id,s,b,sid:s.id,bid:b.id,color:b.color,hex:b.hex,min:b.min,max:b.max,rocodromoId:b.rocodromoId||s.rocodromoId||g.id,presas:b.presas||'',
      name:b.presas?`${b.color} · presas ${String(b.presas).toLowerCase()}`:`${b.color} sin nombre`,unnamed:true,foto:b.foto||'',att:num(b.intentos,0),sess:1,sids:new Set([s.id]),last:s.fecha||'',
      estado:isTop(b)?'encadenado':'sin',principal:false,created:b.t||0,blocks:[{s,b,fecha:s.fecha,sid:s.id}]})}
  return out}
/* quién se queda al fusionar: ficha > nombre propio > foto > más intentos > la más antigua */
function pickKeep(a,b){
  const sc=i=>[i.kind==='f'?1:0,i.unnamed?0:1,i.foto?1:0,i.att,-(i.created||0)];
  const x=sc(a),y=sc(b);for(let k=0;k<x.length;k++)if(x[k]!==y[k])return x[k]>y[k];return true}
/* posibles duplicados: mismo color y rocódromo, presas compatibles, nunca en la misma sesión (si coinciden en una sesión son bloques distintos).
   Una ficha sin nombre se empareja con la mejor del mismo color; dos bloques sueltos, si son de sesiones cercanas (≤14 días). */
function bloqueDupes(vis){
  const compat=(a,b)=>a.color===b.color&&a.rocodromoId===b.rocodromoId&&(!a.presas||!b.presas||a.presas===b.presas)&&![...a.sids].some(x=>b.sids.has(x));
  const pairs=[],used=new Set(),flag=new Set();
  for(const a of vis.filter(i=>i.kind==='f'&&i.unnamed&&i.estado!=='abandonado')){
    if(used.has(a.id))continue;
    const c=vis.filter(b=>b.kind==='f'&&b.id!==a.id&&!used.has(b.id)&&compat(a,b)).sort((x,y)=>(pickKeep(x,y)?-1:1));
    if(c.length){pairs.push([a,c[0]]);used.add(a.id);used.add(c[0].id);flag.add(a.id)}}
  const lo=vis.filter(i=>i.kind==='l'&&!used.has(i.id)&&i.b.resultado!=='flash');   /* un flash es un bloque probado una vez: no se empareja */
  for(let i=0;i<lo.length;i++){const a=lo[i];if(used.has(a.id))continue;
    for(let j=i+1;j<lo.length;j++){const b=lo[j];if(used.has(b.id))continue;
      if((a.att>1||b.att>1)&&compat(a,b)&&Math.abs(pdate(a.last)-pdate(b.last))<=14*864e5){pairs.push([a,b]);used.add(a.id);used.add(b.id);flag.add(a.id);break}}}
  return {pairs,flag,n:used.size}}
const BEST_ZONA=['salida','mitad','final'];

function bestZona(blocks){let z=-1;for(const x of blocks)for(const c of (x.b.caidas||[])){const k=BEST_ZONA.indexOf(c);if(k>z)z=k}return z}

        <button type="button" class="btn pri big" data-act="doMerge">Fusionar 2 bloques</button></div></div>`}}

/* ---------- fusionar ---------- */
/* Fusiona dos elementos de la lista. Re-apunta los bloques de sesión (proyectoId) de la absorbida a la que se queda, marca la absorbida con
   fusionadaEn (no se borra nada) y guarda lo necesario para deshacerlo exactamente. */
async function mergeItems(idA,idB){
  if(S.ro||S.merging||!S.db)return false;
  const items=bloqueItems(),A=items.find(i=>i.id===idA),B=items.find(i=>i.id===idB);
  if(!A||!B||A.id===B.id)return false;
  S.merging=true;
  const keep=pickKeep(A,B)?A:B,gone=keep===A?B:A,sids=new Set([...A.sids,...B.sids]);
  const U={sessions:[],live:null,fichas:[],created:null,att:A.att+B.att,sess:sids.size,keepId:'',goneId:gone.id};
  let ok=true;
  try{
    let keepId=keep.id,targets=gone.blocks.slice();
    if(keep.kind==='l'){   // los dos sueltos: nace una ficha con los datos del que se queda
      const d=fichaFromBlock(keep.b,keep.s.fecha,keep.rocodromoId),tops=[keep,gone].filter(i=>isTop(i.b));
      d.auto=false;d.estado=tops.length?'encadenado':'activo';if(tops.length)d.fechaEnc=tops.map(i=>i.last).sort()[0];else delete d.fechaEnc;
      const foto=keep.foto||gone.foto;if(foto)d.foto=foto;
      const ref=S.db.collection('proyectos').doc();await ref.set(d);keepId=ref.id;CREATED.add(keepId);U.created=keepId;targets=targets.concat(keep.blocks)}
    U.keepId=keepId;
    // 1) bloques de sesión
    const bySes=new Map();for(const x of targets){let e=bySes.get(x.s.id);if(!e)bySes.set(x.s.id,e={s:x.s,bs:[]});e.bs.push(x.b)}
    for(const {s,bs} of bySes.values()){
      if(S.live&&s.id===S.live.id){   // la sesión en curso se guarda desde S.live
        U.live={prev:{}};for(const b of bs){U.live.prev[b.id]=b.proyectoId===undefined?null:b.proyectoId;b.proyectoId=keepId}
        persistLive(true);try{await wq}catch(e){}continue}
      const u={sid:s.id,prev:{}},nb=clone(s.bloques||[]);
      for(const b of nb)if(bs.some(x=>x.id===b.id)){u.prev[b.id]=b.proyectoId===undefined?null:b.proyectoId;b.proyectoId=keepId}
      ok=(await dbUpdate('sesiones',s.id,{bloques:nb}))&&ok;if(!ok)throw 0;U.sessions.push(u)}
    // 2) la ficha que se queda hereda lo que le falte
    if(keep.kind==='f'){
      const kp=keep.p,gp=gone.kind==='f'?gone.p:null,patch={};
      if(gp){if(!kp.beta&&gp.beta)patch.beta=gp.beta;if(!kp.descripcion&&gp.descripcion)patch.descripcion=gp.descripcion;if(!kp.presas&&gp.presas)patch.presas=gp.presas;
        const est=[...new Set([...(kp.estilos||[]),...(gp.estilos||[])])];if(est.length!==(kp.estilos||[]).length)patch.estilos=est;
        if(!kp.foto&&!keep.foto&&gp.foto)patch.foto=gp.foto;if(gp.principal&&!kp.principal)patch.principal=true}
      if(kp.estado!=='encadenado'&&(gp?gp.estado==='encadenado':isTop(gone.b))){patch.estado='encadenado';patch.fechaEnc=(gp&&gp.fechaEnc)||gone.last||today()}
      if(Object.keys(patch).length||kp.auto===true){patch.auto=false;patch.updatedAt=Date.now();U.fichas.push({id:kp.id,orig:origDoc(kp)});ok=(await dbUpdate('proyectos',kp.id,patch))&&ok;if(!ok)throw 0}}
    // 3) la absorbida se marca, no se borra
    if(gone.kind==='f'){const gp=gone.p,m={fusionadaEn:keepId,fusionadaAt:Date.now(),updatedAt:Date.now()};if(gp.principal)m.principal=false;
      if(!U.fichas.some(f=>f.id===gp.id))U.fichas.push({id:gp.id,orig:origDoc(gp)});ok=(await dbUpdate('proyectos',gp.id,m))&&ok;if(!ok)throw 0}
    if(S.sel&&S.sel.tgt==='f:'+gone.id)S.sel.tgt='f:'+keepId;
    S.mergeUndo.push(U);S.bsel=null;if(S.bficha===gone.id)S.bficha=keepId;
    render();toast(`Fusionados · ${U.att} ${U.att===1?'intento':'intentos'} en ${U.sess} ${U.sess===1?'sesión':'sesiones'}`,'undoMerge');
    clearTimeout(toast.t);toast.t=setTimeout(()=>{$('#toast').hidden=true},10000);
    S.merging=false;return true;
  }catch(e){
    S.mergeUndo.push(U);S.merging=false;const rev=await undoMerge(true);toast(rev?'No se pudo fusionar; todo sigue como estaba.':'No se pudo fusionar ni deshacer del todo. Revisa la conexión y pulsa Deshacer.',rev?undefined:'undoMerge');return false}
}
const origDoc=p=>{const o=clone(p);delete o.id;return o};
/* deshace la última fusión: sesiones (proyectoId exacto), fichas (documento original completo) y la ficha creada para la ocasión */
async function undoMerge(silent){
  const U=S.mergeUndo.pop();if(!U){if(!silent)toast('No hay nada que deshacer');return false}
  let ok=true;
  for(const u of U.sessions){const s=S.data.sesiones.find(x=>x.id===u.sid);if(!s)continue;
    const nb=clone(s.bloques||[]);
    for(const b of nb)if(Object.prototype.hasOwnProperty.call(u.prev,b.id)){if(u.prev[b.id]===null)delete b.proyectoId;else b.proyectoId=u.prev[b.id]}
    ok=(await dbUpdate('sesiones',u.sid,{bloques:nb}))&&ok}
  if(U.live&&S.live){for(const b of S.live.bloques)if(Object.prototype.hasOwnProperty.call(U.live.prev,b.id)){if(U.live.prev[b.id]===null)delete b.proyectoId;else b.proyectoId=U.live.prev[b.id]}persistLive(true)}
  for(const f of U.fichas)ok=(await dbSave('proyectos',f.id,f.orig))&&ok;
  if(U.created)ok=(await dbDel('proyectos',U.created))&&ok;
  if(S.sel&&U.keepId&&S.sel.tgt==='f:'+U.keepId&&U.goneId)S.sel.tgt='f:'+U.goneId;
  if(!ok)S.mergeUndo.push(U);
  render();if(!silent)toast(ok?'Fusión deshecha':'No se pudo deshacer del todo; pulsa Deshacer para reintentar',ok?undefined:'undoMerge');
  return ok}

  if(!d.card.isConnected){const c=document.querySelector(`[data-bk="${CSS.escape(d.id)}"]`);if(!c){dragClean();return}d.card=c;c.classList.add('src')}
  const el=document.elementFromPoint(d.x,d.y),c=el&&el.closest&&el.closest('.bcard'),id=c&&c!==d.card?c.dataset.bk:null;
  if(id!==d.tgt){clearTimeout(d.timer);document.querySelectorAll('.bcard.tgt').forEach(x=>x.classList.remove('tgt'));d.tgt=id;d.armed=null;

});

  const a=d.id,b=d.armed;dragClean();if(b)mergeItems(a,b)});

    case 'reviewDupes':{const D=bloqueDupes(bloqueItems().filter(i=>i.estado!=='retirado'));if(D.pairs.length){S.bsel={ids:[D.pairs[0][0].id,D.pairs[0][1].id]};render();window.scrollTo(0,0)}break}

    case 'newBlock':openNuevoBloque();break;
    case 'nbSave':if(F&&F._kind==='nuevo')await nuevoGuardar(a);break;
    case 'nbVideo':if(F&&F._kind==='nuevo'){closeSheet({keep:true});openVideo()}break;

/* ---------- Progreso ---------- */
views.progreso=()=>{

/* tops por color (últimos 30 días), máximo encadenado, hueco de «Tu semana», recuperación y últimas sesiones */
function resumen2b(){
  const cs=mainGym().colores,bl=blocksIn(30),cnt=cs.map(()=>0);
  for(const b of bl)if(isTop(b))cnt[cidx(b)]++;
  const mx=Math.max(0,...cnt),all=blocksIn(0).filter(isTop),m=all.length?Math.max(...all.map(cidx)):-1;
  let mname='';
  if(m>=0){const b=all.filter(x=>cidx(x)===m).sort((a,c)=>(c.fecha||'').localeCompare(a.fecha||'')||(c.t||0)-(a.t||0))[0],p=b.proyectoId&&S.data.proyectos.find(x=>x.id===b.proyectoId);
    mname=p?projName(p):b.color+presaTxt(b)}
  let h=`<div class="section" style="margin-top:14px"><div class="k2" id="topsColor"><div class="kh"><h3>Tops por color</h3><span class="ks">últimos 30 días</span></div>`;
  if(!all.length&&!bl.length)h+=`<p>Cuando registres bloques verás aquí tus tops por color y cómo sube tu color máximo.</p>`;
  else{h+=`<div class="tb2">`+cs.map((c,i)=>({c,i,n:cnt[i]})).reverse().map(r=>`<span class="${r.i===m?'top':''}">${esc(r.c.n)}</span><span class="tr"><i style="--c:${esc(r.c.hex)};width:${mx?r.n/mx*100:0}%"></i></span><span class="n">${r.n}</span>`).join('')+`</div>`;
    h+=`<span class="ks" id="maxEnc">${m>=0?`Máximo encadenado: ${esc(cs[m].n.toLowerCase())} (${esc(mname)})`:'Aún no has encadenado ningún bloque.'}</span>`}
  h+=`</div>`;
  h+=`<div class="k2"><div class="kh"><h3>Tu semana</h3></div><p>Aquí irá el plan semanal.</p></div>`;
  const rec=recoveryAlerts(ses(),ent(),today(),cfg()),lv=rec.some(a=>a.nivel==='alto')?'bad':rec.some(a=>a.nivel==='atencion')?'warn':'good';
  const ult=[...ses(),...ent()].map(x=>x.fecha).filter(Boolean).sort().pop(),dd=ult?daysAgo(ult):null;
  h+=`<div class="k2 ${lv}" id="recup"><h3>Recuperación: ${lv==='good'?'bien':lv==='warn'?'atención':'cuidado'}</h3>${rec.length?alertList(rec):`<p>Sin avisos de recuperación${dd===null?'.':dd===0?'. Hoy ya has entrenado.':`. ${dd} ${dd===1?'día':'días'} desde tu último entreno.`}</p>`}</div>`;
  const last=sesRecientes().slice(0,3);
  h+=`<div class="stack" style="gap:6px"><div class="kh" style="display:flex;justify-content:space-between;align-items:baseline"><h3>Últimas sesiones</h3><button class="linkb" data-act="verHist">Ver todas</button></div>`;
  h+=last.length?`<div class="ses2">${last.map(s=>{const mm=sessionMetrics(s,-1),r=num(s.rpe);return `<button data-act="verSesion" data-id="${esc(s.id)}"><b>${fdateC(s.fecha)}</b><span>${mm.intentos} int · ${mm.tops} tops${r>0?` · ${effWord(r)} (${r})`:''}</span></button>`}).join('')}</div>`:`<div class="empty">Aún no hay sesiones guardadas.</div>`;
  h+=`</div>`;
  h+=`<div class="stack" style="gap:8px"><button class="btn" id="btnDet" data-act="pdet" aria-expanded="${!!S.pdet}">${S.pdet?'Ocultar análisis detallado':'Análisis detallado (pirámide, evolución, puntos débiles)'}</button></div></div>`;
  if(S.pdet)h+=progresoResumen();
  return h}

/* Historial: sesiones (tocar abre el detalle) y entrenos */
views.registro=()=>{
  const items=[...ses().map(s=>({k:'s',x:s})),...ent().map(e=>({k:'e',x:e}))].sort((a,b)=>(b.x.fecha||'').localeCompare(a.x.fecha||'')||(b.x.createdAt||0)-(a.x.createdAt||0));
  let h=`<div class="section"><div class="sechead"><h2>Historial</h2><div class="row">${S.ro?'':`<button class="btn" data-act="newSession">+ Sesión pasada</button><button class="btn" data-act="newEntreno">+ Entreno</button>`}</div></div></div>`;
  if(!items.length)return h+`<div class="section"><div class="empty">Aquí aparecerán tus sesiones de búlder y entrenos, de más reciente a más antiguo.</div></div>`;
  h+='<div class="section log">';
  for(const {k,x} of items){const d=pdate(x.fecha||today()),open=S.open[x.id];
    if(k==='s'){const bl=(x.bloques||[]).filter(b=>b.resultado),t=bl.filter(isTop).length;
      h+=`<div class="entry"><button class="head" data-act="verSesion" data-id="${esc(x.id)}"><div class="date"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div><div class="meta"><div class="t">${esc(x.lugar||'Búlder')}</div><div class="d"><span class="num">${t}/${bl.length}</span> tops · <span class="num">${num(x.duracion)}</span> min · esfuerzo <span class="num">${num(x.rpe)||'—'}</span>${hayDolor(x.dolor)?' · <span style="color:var(--bad)">dolor</span>':''}</div>${dots(bl)}</div><span class="muted">›</span></button></div>`;
    }else{
      h+=entryHead(x,d,open,`<div class="t">${esc(x.tipo||'Entreno')}</div><div class="d"><span class="num">${num(x.duracion)}</span> min · esfuerzo <span class="num">${num(x.rpe)||'—'}</span>${x.detalle?' · '+esc(x.detalle):''}</div>`,'<span class="tag">entreno</span>')+`
        ${open?`<div class="body">${x.detalle?`<div><span class="eyebrow">Protocolo</span><div>${esc(x.detalle)}</div></div>`:''}${x.carga?`<div><span class="eyebrow">Carga añadida</span> <span class="num">${esc(x.carga)} kg</span></div>`:''}${x.notas?`<div class="muted">${esc(x.notas)}</div>`:''}
        ${S.ro?'':`<div class="row"><button class="btn small" data-act="editEntreno" data-id="${x.id}">Editar</button>${delBtn('entrenos',x.id)}</div>`}</div>`:''}</div>`}}
  return h+'</div>'};

/* abrir / cerrar el detalle de una sesión (con entrada de historial para que Atrás vuelva a la lista) */
function abrirSesion(id){
  S.sesDet=id;S.psub='hist';S.view='progreso';renderTabs();

function cerrarDetalle(){
  S.sesDet=null;if(S.bficha){S.view='bloques';renderTabs()}render();window.scrollTo(0,0);

/* bloques de la sesión: nuevo (primera vez que se prueba), proyecto (ya probado antes sin encadenar, o tu proyecto principal), encadenado hoy */
function bloquesDeSesion(s){
  const FI=fichaItems(),out=[];
  for(const b of (s.bloques||[])){if(!(num(b.intentos,0)>0||b.resultado))continue;
    const p=b.proyectoId&&S.data.proyectos.find(x=>x.id===b.proyectoId),items=(p&&FI.get(p.id))||[];
    const prior=items.filter(x=>x.sid!==s.id&&((x.fecha||'')<(s.fecha||'')||((x.fecha||'')===(s.fecha||'')&&(x.b.t||0)<(b.t||0))));
    const nuevo=!!p&&prior.length===0,proy=!!p&&((prior.length>0&&!prior.some(x=>isTop(x.b)))||p.principal===true);
    out.push({b,p,nuevo,proy,enc:proy&&isTop(b)})}
  return out}

function detalleSesion(id){

  h+=`<div class="tri2"><div><strong id="dMed">${mmss(m.descansoMedio)}</strong><span>descanso medio</span></div><div><strong id="dMax">${mmss(m.descansoMax)}</strong><span>descanso más largo</span></div><div><strong id="dHora">${m.intentosHora!=null?String(m.intentosHora).replace('.',',')+' / h':'—'}</strong><span>intentos (sin calentar)</span></div></div>`;
  h+=`<p id="calTxt2">${m.calentN>0?(m.calentManual?`Calentamiento corregido a mano: los primeros ${m.calentN} ${m.calentN===1?'intento':'intentos'}.`:mi>=0?`Calentamiento detectado: los primeros ${m.calentN} ${m.calentN===1?'intento':'intentos'}, 2 colores o más por debajo de tu máximo (${esc(cs[mi].n.toLowerCase())}).`:`Calentamiento detectado: los primeros ${m.calentN} intentos del color más bajo.`):'No se ha detectado calentamiento.'}${m.descansoMedio===null&&m.intentos>0?' Esta sesión no guardó la hora de cada intento, por eso no hay descansos.':''}</p></section>`;
  const mxI=Math.max(1,...m.porColor.map(c=>c.intentos));

  const f=YO[k];if(!f||S.ro)return;const c=cfg();
  let v=c[k];if(k==='descanso')v=num(v,180);if(v==null)v='';
  F={_kind:'yofield',key:k,val:String(v)};
  const inp=f.type==='area'?`<textarea id="y_val" data-f="val" rows="3" placeholder="${esc(f.ph||'')}">${esc(F.val)}</textarea>`
    :`<input id="y_val" data-f="val" type="${f.type==='number'||f.type==='dec'?'text':'text'}" ${f.type==='number'?'inputmode="numeric"':f.type==='dec'?'inputmode="decimal"':''} value="${esc(F.val)}" placeholder="${esc(f.ph||'')}" style="min-height:52px;font-size:18px">`;
  setSheet(`<div class="sheethead"><h2>${f.t}</h2><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="yoSave">Guardar</button></div><div class="stack"><label class="field"><span>${f.t}${f.u?' ('+f.u+')':''}</span>${inp}</label>${f.hint?`<p class="muted sm" style="margin:0">${f.hint}</p>`:''}${f.type!=='area'&&k!=='descanso'&&k!=='nombre'?'<p class="muted sm" style="margin:0">Déjalo en blanco para quitarlo.</p>':''}</div>`);
  setTimeout(()=>{const e=document.getElementById('y_val');if(e)e.focus()},50)}
async function yoSave(a){
  if(!F||F._kind!=='yofield')return;const f=YO[F.key],raw=String(F.val??'').trim();let v;
  if(f.type==='text'||f.type==='area')v=raw;
  else if(raw==='')v=(F.key==='descanso')?180:'';
  else{const n=parseFloat(raw.replace(',','.'));
    if(!isFinite(n)||n<f.lo||n>f.hi){toast(`Revisa el valor: entre ${f.lo} y ${f.hi} ${f.u}.`);return}
    v=f.type==='number'?Math.round(n):Math.round(n*10)/10}
  const d=clone(cfg());if(!d.rocodromos||!d.rocodromos.length)d.rocodromos=[clone(DEFAULT_GYM)];
  d[F.key]=v;a.disabled=true;
  if(await dbSave('config','main',d)){closeSheet();toast('Guardado')}else a.disabled=false}

/* ---------- Coach ---------- */
const COACH_BTN=(act,ico,t,s,o={})=>`<button class="ccard" data-act="${act}" ${o.id!==undefined?`data-id="${esc(o.id)}"`:''} ${o.dis?'disabled':''}><span class="cico">${svg2(ico)}</span><span class="ctx"><strong>${t}</strong><span>${s}</span></span></button>`;
views.coach=()=>{
  const C=S.coach,off=S.noClaude,sr=sesRecientes(),last=sr[0],busy=C.busy,dis=off||busy;
  const pj=mainProject()||S.data.proyectos.find(p=>!p.fusionadaEn&&p.estado==='activo'),saved=S.data.analisis[0];
  let h=`<div class="section cc"><div class="sechead"><h1>Coach</h1><span class="iapill">Usa IA</span></div>`;
  if(off)h+=`<div class="banner" id="coachOff">Claude no está disponible en esta vista. Abre la página en claude.ai y permite que use Claude cuando te lo pida. Mientras tanto estas acciones están desactivadas; el resto de la app funciona igual.</div>`;
  h+=`<button class="cmain" disabled aria-disabled="true"><span class="cico">${svg2('cal')}</span><span class="ctx"><strong>Preparar mi semana</strong><span>Rutina con tus datos, tu proyecto y la investigación</span></span><span class="soon">Próximamente</span></button>`;
  h+=COACH_BTN('coachSession','sesion','Analizar la última sesión',last?`${fdateC(last.fecha)} · ${sessionMetrics(last,-1).intentos} intentos`:'Registra una sesión primero',{id:last?last.id:'',dis:dis||!last});
  h+=COACH_BTN('coachGlobal','lupa','¿Por qué me caigo?','Diagnóstico con tus últimas semanas',{dis:dis||!last});
  h+=COACH_BTN('video','video','Analizar un vídeo','Beta, grado estimado y en qué fallas',{dis});
  h+=COACH_BTN('coach2Proj','bloque','Analizar proyecto',pj?esc(projName(pj)):'Elige un proyecto en Bloques',{id:pj?pj.id:'',dis:dis||!pj});
  h+=COACH_BTN('coachLoad','carga','Carga y descanso','Si toca apretar o recuperar esta semana',{dis:dis||!last});
  h+=`</div>`;
  if(C.title||C.busy||saved){
    const cur=!!(C.title||C.busy),title=cur?C.title:saved.titulo,body=cur?C.out:saved.texto;
    h+=`<div class="section"><div class="sechead"><h2 style="font-family:var(--f-body);font-size:14px;letter-spacing:.06em;color:var(--muted)">Última respuesta</h2><div class="row">${C.busy?'<button class="btn small" data-act="coachStop">Parar</button>':''}${cur&&!C.busy&&C.out&&!C.saved&&!S.ro?(C.kind==='proyecto'&&C.projId?'<button class="btn small pri" data-act="coachFicha">Guardar en la ficha del bloque</button>':'<button class="btn small pri" data-act="coachSave">Guardar análisis</button>'):''}${cur&&C.saved?'<span class="pill good">Guardado</span>':''}</div></div>
      <div class="panel coachout" ${cur?'aria-live="polite"':''}><strong style="font-size:15px;display:block;margin-bottom:6px">${esc(title)}</strong>${body?md(body):'<span class="thinking"><i></i><i></i><i></i></span>'}</div></div>`}
  if(!off)h+=`<div class="section"><h2 style="font-family:var(--f-body);font-size:14px;letter-spacing:.06em;color:var(--muted)">Pregúntale</h2><div class="chatlog">${C.chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a coachout'}">${m.role==='user'?esc(m.content):(m.content?md(m.content):'<span class="thinking"><i></i><i></i><i></i></span>')}</div>`).join('')}</div>
    <form id="chatForm" class="row" style="align-items:flex-end"><div class="field" style="flex:1"><textarea id="chatIn" aria-label="Pregunta para el coach" placeholder="p. ej. ¿Qué hago para pasar de rojos a morados?" rows="2"></textarea></div><button class="btn pri" style="min-height:48px" ${C.busy?'disabled':''}>Enviar</button></form>
    ${C.chat.length?'<div><button class="btn ghost small" data-act="chatClear">Empezar conversación nueva</button></div>':''}</div>`;
  return h+savedList()};

/* ---------- acciones nuevas (las llama el despachador de data-act) ---------- */
function f2bAct(act,a,id){
  switch(act){
    case 'verSesion':abrirSesion(id);return true;
    case 'sesBack':cerrarDetalle();return true;
    case 'verHist':S.psub='hist';render();window.scrollTo(0,0);return true;
    case 'pdet':S.pdet=!S.pdet;render();return true;
    case 'sesBlocks':S.open['det:'+S.sesDet]=!S.open['det:'+S.sesDet];render();return true;
    case 'abrirFicha':openMemFicha(id);return true;    /* función de apertura de ficha de F1 */
    case 'yoEdit':openYoField(a.dataset.k);return true;
    case 'yoSave':yoSave(a);return true;
    case 'yoAddGym':openSettings();F.rocodromos.push({id:'g'+uid(),nombre:'Otro rocódromo',colores:clone(DEFAULT_GYM.colores)});paintSettings();return true;
    case 'coach2Proj':S.coach.projId=id;coachProj(id);return true;
    case 'coachFicha':{const C=S.coach;a.disabled=true;
      dbSave('analisis',null,{fecha:today(),tipo:C.kind,titulo:C.title,texto:C.out,proyectoId:C.projId,createdAt:Date.now()}).then(ok=>{if(ok){C.saved=true;render();toast('Guardado en la ficha del bloque')}else a.disabled=false});return true}
  }
  return false}
/* === fin F2b === */

init();
</script>

<script>
/* guardar lo pendiente de la sesión en vivo al ocultar o cerrar la página */
function __betaFlush(){
  /* petición inmediata, sin esperar a la cola de la app (wq); es lo mismo que haría flushLive, así que no se repite.
     El orden lo mantiene la cola de local-claude. Se envía siempre al ocultar (repetirlo es inofensivo). */
  try{if(typeof S!=='undefined'&&S.live&&S.db&&!S.ro){var L=S.live;
    if(typeof wt!=='undefined')clearTimeout(wt);
    S.db.doc('sesiones/'+L.id).update({bloques:L.bloques,updatedAt:Date.now()}).catch(function(){})}}catch(e){}
}
/* si esta ventana pierde el cerrojo (otra pulsó «Usar aquí»): solo lectura y se cierra la sesión en pantalla */
addEventListener('beta-readonly',function(){try{
  if(typeof S==='undefined')return;
  S.ro=true;
  if(typeof wt!=='undefined')clearTimeout(wt);
  if(S.live){S.live=null;S.rest=null;S.undo=[];S.sel=null;S.liveOpen=false;try{wake(false)}catch(e){}try{closeSheet()}catch(e){}try{popLiveState()}catch(e){}var tt=document.getElementById('toast');if(tt)tt.hidden=true}
  render();
}catch(e){}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')__betaFlush();else if(window.__betaReg)window.__betaReg.update().catch(function(){})});
addEventListener('pagehide',__betaFlush);addEventListener('beforeunload',__betaFlush);
/* service worker + aviso de versión nueva (no recarga sola) */
if('serviceWorker' in navigator)addEventListener('load',function(){
  navigator.serviceWorker.register('sw.js').then(function(reg){window.__betaReg=reg;
    var avisar=function(){if(document.getElementById('betaNueva'))return;var d=document.createElement('div');d.id='betaNueva';d.setAttribute('role','status');
      d.textContent='Hay versión nueva: se aplicará al volver a abrir';
      d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(30px + env(safe-area-inset-top,0px));pointer-events:none;z-index:99998;background:#172126;color:#fff;font:500 13px system-ui,sans-serif;padding:8px 14px;border-radius:12px;max-width:92vw;text-align:center';
      document.body.appendChild(d);setTimeout(function(){d.remove()},8000)};
    reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;
      w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)avisar()})});
  }).catch(function(){})});</script>
