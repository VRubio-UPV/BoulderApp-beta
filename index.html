<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B5E20"><title>Cuaderno de Búlder (beta)</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><script>/* Sustituto local de window.claude para la beta instalable (fuera de claude.ai).
   Guarda en IndexedDB ('cuaderno-beta'): almacén 'docs' (clave [c,id]) y almacén 'blobs' (clave id).
   Imita la semántica de tests/e2e/mock.js. Cada escritura espera a que IndexedDB confirme (oncomplete)
   ANTES de tocar la memoria y avisar; si falla lanza {code:'unavailable'} y no cambia nada. */
(function () {
  if (window.claude) return;
  const DB_NAME = 'cuaderno-beta';
  const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const fail = () => ({ code: 'unavailable' });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

  const RO = { code: 'permission-denied' };
  const errCode = e => (e && e.code === 'permission-denied') ? e : ((e && e.name === 'QuotaExceededError') || (e && e.code === 22)) ? { code: 'quota_exceeded' } : fail();
  const NAME = 'cuaderno-beta-escritor';
  /* Un solo escritor: la primera ventana toma el cerrojo y lo mantiene mientras viva. Las demás quedan en solo lectura.
     Además, cada toma del cerrojo incrementa un contador en el almacén 'ctl' y cada escritura comprueba, dentro de su
     propia transacción, que el contador sigue siendo el suyo (protege frente a una ventana congelada que despierta). */
  let readOnly = false, hasLock = false, myToken = 0, checkOn = false, urgent = false, trusted = false;
  let bar = null;

  function showRO() {
    if (bar) return;
    const build = () => {
      if (bar) return;
      bar = document.createElement('div');
      const note = document.createElement('div');
      note.textContent = 'Abierta en otra ventana. Cierra la otra o pulsa Usar aquí';
      note.setAttribute('role', 'status');
      note.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99999;background:#B9561A;color:#fff;font:600 13px system-ui,sans-serif;padding:4px 12px;border-radius:0 0 10px 10px;pointer-events:none;max-width:90vw;text-align:center';
      const btn = document.createElement('button');
      btn.type = 'button'; btn.id = 'betaUsarAqui'; btn.textContent = 'Usar aquí';
      btn.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:99999;min-height:52px;border:0;border-radius:14px;background:#1B5E20;color:#fff;font:600 17px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.3)';
      btn.addEventListener('click', useHere);
      bar.append(note, btn);
      document.body.appendChild(bar);
      document.body.style.paddingBottom = '72px';   // que el botón no tape el final del contenido
    };
    if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
  }
  function loseLock() {
    const first = !readOnly;
    readOnly = true; showRO();
    if (first) { try { window.dispatchEvent(new Event('beta-readonly')); } catch (e) {} }   // el script de la página cierra la sesión en pantalla
  }
  /* tras reanudar/volver a primer plano, la vía urgente se desactiva hasta confirmar leyendo 'ctl' que el contador sigue siendo el nuestro */
  async function verifyToken() {
    if (!checkOn || readOnly) return;
    try {
      const d = await getDb();
      await new Promise((res, rej) => {
        const t = d.transaction('ctl', 'readonly'), g = t.objectStore('ctl').get('owner');
        g.onsuccess = () => { if (!g.result || g.result.n !== myToken) loseLock(); else trusted = true; };
        t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error);
      });
    } catch (e) {}
  }
  const untrust = () => { trusted = false; verifyToken(); };
  /* «Usar aquí»: roba el cerrojo, se apodera del contador y recarga la página entera con los datos de IndexedDB */
  async function useHere() {
    const btn = document.getElementById('betaUsarAqui'); if (btn) btn.disabled = true;
    try {
      await new Promise((res, rej) => {
        navigator.locks.request(NAME, { steal: true }, () => { res(); return new Promise(() => {}); }).catch(rej);
      });
      await claimToken(await getDb());
      location.reload();
    } catch (e) { if (btn) btn.disabled = false; }
  }
  const hasLocksApi = !!(navigator.locks && navigator.locks.request);
  const lockReady = (async () => {
    if (!hasLocksApi) return;
    for (let i = 0; i < 6; i++) {   // reintenta un poco: al recargar, el cerrojo de la página anterior tarda en soltarse
      const got = await new Promise(res => {
        let acquired = false;
        navigator.locks.request(NAME, { ifAvailable: true }, lock => {
          if (!lock) { res(false); return; }
          acquired = true; hasLock = true; res(true);
          return new Promise(() => {});   // se mantiene hasta que se cierra la página
        }).catch(() => { if (acquired) loseLock(); else res(true); });   // si nos lo roban: solo lectura
      });
      if (got) return;
      await new Promise(r => setTimeout(r, 250));
    }
    loseLock();
  })();
  /* al ocultar/cerrar, las escrituras salen por la vía rápida (sin lectura previa del contador) y con commit() inmediato */
  document.addEventListener('visibilitychange', () => { urgent = document.visibilityState === 'hidden'; if (!urgent) untrust(); });
  addEventListener('pagehide', () => { urgent = true; });
  addEventListener('beforeunload', () => { urgent = true; });
  addEventListener('pageshow', () => { urgent = false; untrust(); });
  document.addEventListener('freeze', () => { trusted = false; });
  document.addEventListener('resume', untrust);

  let idb = null, store = null, loading = null;
  const collL = [], docL = [];
  const coll = c => store[c] || (store[c] = new Map());
  let idc = 0;
  const newId = () => 'd' + Date.now().toString(36) + (++idc) + Math.random().toString(36).slice(2, 7);

  function openDb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: ['c', 'id'] });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('ctl')) d.createObjectStore('ctl', { keyPath: 'id' });
      };
      r.onsuccess = () => {
        const d = r.result;
        d.onversionchange = () => { try { d.close(); } catch (e) {} if (idb === d) idb = null; };
        d.onclose = () => { if (idb === d) idb = null; };
        res(d);
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    });
  }
  function load() {
    if (loading) return loading;
    loading = (async () => {
      const d = await openDb();
      if (hasLock) { idb = d; await claimToken(d); }
      const rows = await new Promise((res, rej) => {
        const q = d.transaction('docs', 'readonly').objectStore('docs').getAll();
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
      const s = {};
      for (const row of rows) (s[row.c] || (s[row.c] = new Map())).set(row.id, row.d);
      idb = d; store = s;
    })();
    loading.catch(() => { loading = null; });   // permite reintentar
    return loading;
  }
  async function getDb() { if (!idb) idb = await openDb(); return idb; }
  /* toma el contador de escritor: lee y suma 1 en una transacción */
  function claimToken(d) {
    return new Promise((res, rej) => {
      const t = d.transaction('ctl', 'readwrite');
      const st = t.objectStore('ctl'), g = st.get('owner');
      let n = 0;
      g.onsuccess = () => { n = ((g.result && g.result.n) || 0) + 1; st.put({ id: 'owner', n }); };
      t.oncomplete = () => { myToken = n; checkOn = true; trusted = true; res(); };
      t.onerror = t.onabort = () => rej(t.error || fail());
    });
  }
  /* ejecuta una escritura y resuelve SOLO en oncomplete. Camino normal: dentro de la misma transacción se comprueba que el
     contador sigue siendo el nuestro. Camino urgente (página ocultándose): sin lectura previa, para poder pedir commit() sin
     volver al bucle de eventos. */
  async function tx(storeName, fn) {
    if (readOnly) throw RO;
    const d = await getDb();
    return new Promise((res, rej) => {
      let t, denied = false;
      const open = names => { try { return d.transaction(names, 'readwrite', { durability: 'strict' }); } catch (e0) { return d.transaction(names, 'readwrite'); } };
      try {
        const check = checkOn && !(urgent && trusted);
        t = open(check ? [storeName, 'ctl'] : storeName);
        t.oncomplete = () => res();
        t.onerror = () => rej(denied ? RO : (t.error || fail()));
        t.onabort = () => rej(denied ? RO : (t.error || fail()));
        const go = () => { fn(t.objectStore(storeName)); if (t.commit) t.commit(); };
        if (!check) go();
        else {
          const g = t.objectStore('ctl').get('owner');
          g.onsuccess = () => {
            if (!g.result || g.result.n !== myToken) { denied = true; loseLock(); try { t.abort(); } catch (e) {} return; }
            try { go(); } catch (e) { try { t.abort(); } catch (e2) {} rej(e); }
          };
        }
      } catch (e) { try { t && t.abort(); } catch (e2) {} rej(e); }
    });
  }
  /* las escrituras se serializan para que update lea siempre el estado ya confirmado */
  let chain = Promise.resolve();
  const serial = fn => { const p = chain.then(fn); chain = p.catch(() => {}); return p; };

  function docSnap(c, id) {
    const d = coll(c).get(id);
    return { id, exists: d !== undefined, data: () => clone(d), ref: refOf(c, id) };
  }
  function queryDocs(q) {
    let arr = [...coll(q.c).entries()].map(([id, d]) => ({ id, d }));
    /* en solo lectura no se ofrece la sesión en curso de la otra ventana (no se podría guardar nada en ella) */
    if (readOnly && q.c === 'sesiones') arr = arr.filter(x => x.d.estado !== 'en_curso');
    if (q.field) {
      arr = arr.filter(x => x.d[q.field] !== undefined);
      arr.sort((a, b) => {
        const x = a.d[q.field], y = b.d[q.field];
        const r = x < y ? -1 : x > y ? 1 : 0;
        return (q.dir === 'desc' ? -r : r) || (a.id < b.id ? -1 : 1);
      });
    }
    if (q.n) arr = arr.slice(0, q.n);
    return arr;
  }
  function qSnap(q) {
    const docs = queryDocs(q).map(x => ({ id: x.id, exists: true, data: () => clone(x.d) }));
    return { docs, size: docs.length, empty: docs.length === 0, forEach: f => docs.forEach(f) };
  }
  function notify(c, id) {
    setTimeout(() => {
      for (const l of collL.slice()) if (l.q.c === c) { try { l.next(qSnap(l.q)); } catch (e) { setTimeout(() => { throw e; }); } }
      for (const l of docL.slice()) if (l.c === c && l.id === id) { try { l.next(docSnap(c, id)); } catch (e) { setTimeout(() => { throw e; }); } }
    }, 0);
  }
  function mkQuery(c, st) {
    const q = Object.assign({ c }, st);
    return {
      orderBy: (f, d) => mkQuery(c, { ...q, field: f, dir: d || 'asc' }),
      limit: n => mkQuery(c, { ...q, n }),
      get: async () => qSnap(q),
      onSnapshot(next) {
        const l = { q, next };
        collL.push(l);
        setTimeout(() => { if (collL.includes(l)) next(qSnap(q)); }, 0);
        return () => { const i = collL.indexOf(l); if (i >= 0) collL.splice(i, 1); };
      },
    };
  }
  async function put(c, id, val) {
    if (readOnly) throw RO;
    try { await tx('docs', s => s.put({ c, id, d: val })); } catch (e) { throw errCode(e); }
    coll(c).set(id, val); notify(c, id);
  }
  function refOf(c, id) {
    return {
      id, path: c + '/' + id,
      get: async () => docSnap(c, id),
      set: data => {
        if (readOnly) return Promise.reject(RO);
        let v; try { v = clone(data); } catch (e) { return Promise.reject(fail()); }   // se clona en el momento de la llamada
        return serial(() => put(c, id, v));
      },
      update: data => {
        if (readOnly) return Promise.reject(RO);
        let v; try { v = clone(data); } catch (e) { return Promise.reject(fail()); }
        return serial(async () => {
          const cur = coll(c).get(id);
          if (cur === undefined) throw { code: 'not-found' };
          await put(c, id, { ...cur, ...v });
        });
      },
      delete: () => readOnly ? Promise.reject(RO) : serial(async () => {
        try { await tx('docs', s => s.delete([c, id])); } catch (e) { throw errCode(e); }
        coll(c).delete(id); notify(c, id);
      }),
      onSnapshot(next) {
        const l = { c, id, next };
        docL.push(l);
        setTimeout(() => { if (docL.includes(l)) next(docSnap(c, id)); }, 0);
        return () => { const i = docL.indexOf(l); if (i >= 0) docL.splice(i, 1); };
      },
    };
  }
  const db = {
    collection(c) {
      return {
        ...mkQuery(c, {}),
        doc: id => refOf(c, id || newId()),
        async add(data) { if (readOnly) throw RO; const r = refOf(c, newId()); await r.set(data); return r; },
      };
    },
    doc(path) { const [c, id] = path.split('/'); return refOf(c, id); },
  };
  const user = { canEdit: async () => !readOnly, isOwner: async () => !readOnly, id: async () => 'local', can: async () => true };
  const assets = {
    async upload(blob) {
      if (readOnly) throw RO;
      const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { await tx('blobs', s => s.put({ id, blob, type: (blob && blob.type) || '' })); } catch (e) { throw errCode(e); }
      return { id, url: '_blob/' + id };
    },
    async delete(id) {
      if (readOnly) throw RO;
      id = (id && id.id) || id;
      try { await tx('blobs', s => s.delete(id)); } catch (e) { throw errCode(e); }
      return { deleted: true };
    },
    async list() {
      const d = await getDb();
      const ids = await new Promise((res, rej) => {
        const q = d.transaction('blobs', 'readonly').objectStore('blobs').getAllKeys();
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      }).catch(() => []);
      return { assets: ids.map(id => ({ id })) };
    },
  };
  window.claude = {
    use: async name => {
      if (name !== 'db' && name !== 'user' && name !== 'assets') throw { code: 'unknown_capability' };
      await lockReady;
      try { await load(); } catch (e) { throw fail(); }
      return name === 'db' ? db : name === 'user' ? user : assets;
    },
  };
})();
</script></head><body>
<title>Cuaderno de Búlder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cuaderno de rocódromo — botones grandes de presa por color para usar con magnesio; pestañas abajo en móvil, una columna de ~780px */
:root{
  --bg:#E8EDE7; --surface:#F7FAF6; --sunk:#DCE5DA; --ink:#172126; --muted:#56656A; --line:#C9D6C7;
  --accent:#1B5E20; --accent-ink:#FFFFFF; --accent-soft:#CFE3CB; --hold:#E9AE16;
  --good:#1F6B4A; --warn:#B9561A; --bad:#B3261E;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E150F; --surface:#172219; --sunk:#111A12; --ink:#E4EBE8; --muted:#93A3A6; --line:#28382A;
  --accent:#3E9A4A; --accent-ink:#FFFFFF; --accent-soft:#16301A; --hold:#F2C14B;
  --good:#7FD3A8; --warn:#F0904F; --bad:#F27168; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E150F; --surface:#172219; --sunk:#111A12; --ink:#E4EBE8; --muted:#93A3A6; --line:#28382A;
  --accent:#3E9A4A; --accent-ink:#FFFFFF; --accent-soft:#16301A; --hold:#F2C14B;
  --good:#7FD3A8; --warn:#F0904F; --bad:#F27168; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.topin{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:850;font-stretch:72%;font-size:22px;letter-spacing:.01em;text-transform:uppercase;line-height:1;min-width:0}
.brand small{display:block;font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topin .sp{flex:1}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs svg{width:18px;height:18px}
nav.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
nav.bottom button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px}
nav.bottom button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
@media (max-width:860px){header.top nav.tabs{display:none} nav.bottom{display:flex}}

h1,h2,h3{font-family:var(--f-display);font-stretch:78%;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px;font-weight:850;text-transform:uppercase;letter-spacing:.005em}
h2{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:16px;font-weight:750}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.eyebrow.mb{margin-bottom:6px}
.muted.sm{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack,.yo2{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .v{font-family:var(--f-display);font-stretch:75%;font-weight:850;font-size:30px;line-height:1.1;margin-top:6px}
.kpi .s{font-size:13px;color:var(--muted);margin-top:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn.big{min-height:58px;font-size:18px;padding-inline:20px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.sw{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 0 0 1px var(--line);flex:none;vertical-align:-3px}
.sw.lg{width:22px;height:22px}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:13px;white-space:nowrap}
.cchip small{font:500 11px var(--f-mono);color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;background:var(--sunk);color:var(--muted);border:0}
.tag.fail{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
button.tag{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:600;font-size:13px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.res{font:600 12px/1 var(--f-mono);padding:4px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.res.flash{background:var(--hold);color:#2a1f00}
.res.top{background:var(--accent);color:var(--accent-ink)}
.res.no{background:transparent;border:1px solid var(--line);color:var(--muted)}
/* ---- fotos y memoria ---- */
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none;box-shadow:0 0 0 1px var(--line);display:block}
.thumb.lg{width:64px;height:64px}
.thumb.xl{width:120px;height:120px;border-radius:12px}
.photobtn{cursor:pointer;position:relative}
.photobtn svg{width:16px;height:16px}
.blkimgbtn{border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.bigphoto{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--sunk);display:block}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.empty b{color:var(--ink)}
.banner{padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px}

/* ---- sesión en curso ---- */
.live,.home{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.clock{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.clock .t{font:600 40px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px}
.holds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hold{border:0;border-radius:16px;min-height:84px;background:var(--c);color:var(--on);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 1px var(--line);font-weight:700;font-size:14px;padding:6px 4px;position:relative}
.hold small{font:500 11px var(--f-mono);opacity:.85}
.hold:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 0 0 1px var(--line)}
.hold .ct{position:absolute;top:6px;right:8px;font:600 11px var(--f-mono);background:rgba(0,0,0,.3);color:#fff;border-radius:999px;padding:0 6px}
.active{border-radius:16px;border:2px solid var(--c);background:var(--surface);overflow:hidden}
.active .ah{display:flex;align-items:center;gap:12px;padding:12px 14px;background:color-mix(in srgb,var(--c) 20%,var(--surface));flex-wrap:wrap}
.active .ah .nm{font-family:var(--f-display);font-stretch:75%;font-weight:850;font-size:24px;text-transform:uppercase;line-height:1}
.active .ab{padding:14px;display:flex;flex-direction:column;gap:12px}
.bigrow,.fallTop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;border-radius:14px;min-height:64px;font-weight:700;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.act small{font-weight:500;font-size:12px;opacity:.8}
.act.top{background:var(--accent);color:var(--accent-ink)}
.act.no{background:var(--sunk);color:var(--ink)}
.today,.yo2 section{display:flex;flex-direction:column;gap:6px}

/* ---- registro ---- */
.log,.chatlog,.blist{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.entry>button.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;width:100%;cursor:pointer}
.entry>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.date{font-family:var(--f-display);font-stretch:70%;font-weight:850;text-align:center;line-height:1;text-transform:uppercase}
.date b{display:block;font-size:26px}
.date span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.entry .meta{min-width:0}
.entry .meta .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .meta .d{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.dots i.no{opacity:.25}
.body{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}

/* ---- gráficas ---- */
.pyr{display:flex;flex-direction:column;gap:5px}
.pyr .r{display:grid;grid-template-columns:100px 1fr 44px;align-items:center;gap:8px}
.pyr .r .g{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.pyr .r .n{font:500 12px var(--f-mono);color:var(--muted)}
.pyr .bar{height:22px;display:flex;justify-content:center}
.pyr .bar span{height:100%}
.pyr .bar .fl{background:var(--hold);border-radius:4px 0 0 4px}
.pyr .bar .tp{background:var(--accent);border-radius:0 4px 4px 0}
.pyr .bar .only{border-radius:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font:500 11px var(--f-mono)}
.chart .lbc{fill:var(--ink);font:600 12px var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.end{fill:var(--accent)}
.chart .vb{fill:var(--sunk)}
.chart .vb2{fill:var(--accent);opacity:.75}
.chart .lb2{fill:var(--ink);font:600 11px var(--f-mono)}
.hbars,.alist{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(80px,150px) 1fr 74px;gap:10px;align-items:center;font-size:14px}
.hb .tr{height:12px;background:var(--sunk);border-radius:6px;position:relative}
.hb .tr span{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.hb .tr span.w{background:var(--warn)}
.hb .tr em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.hb .v{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:14px}
.alerts li.w{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.alerts li.b{background:color-mix(in srgb,var(--bad) 13%,transparent)}

/* ---- proyectos ---- */
.proj{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}

.toggles button .thumb{width:24px;height:24px;border-radius:50%}
.qchip{display:inline-flex;align-items:stretch;border:1px solid var(--line);background:var(--surface);border-radius:999px;overflow:hidden}
.qchip button{border:0;background:none;cursor:pointer;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.qchip button+button{border-left:1px solid var(--line);color:var(--muted);padding-inline:9px}
.qlist{display:flex;gap:8px;flex-wrap:wrap}
.dg{border-left:4px solid var(--warn);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px}
.dg .dt{font-weight:600;font-size:16px;line-height:1.35}
.dg .ds{font-size:14px;color:var(--muted)}

/* ---- coach ---- */
.coachout{font-size:15px;line-height:1.6}
.coachout h3{font-size:17px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.02em}
.coachout h3:first-child{margin-top:0}
.coachout h4{font-size:15px;margin:12px 0 4px;font-family:var(--f-display);font-stretch:85%}
.coachout ul,.coachout ol{margin:4px 0 8px;padding-left:20px}
.coachout p{margin:6px 0;max-width:68ch}
.msg{padding:10px 12px;border-radius:10px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent-soft)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}

/* ---- hoja / formularios ---- */
.sheetbg{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:center;align-items:flex-end}
@media (min-width:861px){.sheetbg{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:16px 16px 0 0;
  padding-block:0 calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:861px){.sheet{border-radius:16px}}
.sheethead{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sheethead h2{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:42px}
input[type=color]{width:42px;height:42px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-mono);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.frames figure{margin:0;display:flex;flex-direction:column;gap:2px}
.frames img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:8px;background:var(--sunk);max-width:100%}
.frames figcaption{font-size:11px;color:var(--muted);text-align:center}
.rpehint{font-size:14px;color:var(--muted);min-height:20px}
.rpehint b{color:var(--ink)}
.rpeguide{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.rpeguide summary{cursor:pointer;font-weight:600;color:var(--accent)}
.rpeguide p{margin:8px 0;color:var(--muted)}
.rpeguide table{width:100%;border-collapse:collapse;margin-top:6px}
.rpeguide th{text-align:left;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.rpeguide td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.rpeguide td:first-child{white-space:nowrap;font-weight:600}
.rpeguide td:nth-child(2){white-space:nowrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.toggles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggles.f button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.bform{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.bform .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bform .top select{width:auto;min-width:110px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:36px;height:38px;font-size:18px;cursor:pointer}
.stepper span{min-width:30px;text-align:center;font:600 15px var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:calc(100% - 32px)}
.colorrow{display:grid;grid-template-columns:42px minmax(0,1fr) 78px 78px 32px;gap:6px;align-items:center}
.colorrow select{padding-inline:6px}

/* ---- temporizador ---- */
.tmr{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center}
.tmr .ph{font-family:var(--f-display);font-stretch:72%;font-weight:850;font-size:28px;text-transform:uppercase;letter-spacing:.03em}
.tmr .big{font:600 clamp(64px,22vw,120px)/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.tmr.work{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.tmr.rest{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.tmr.setrest{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tmr.prep{background:color-mix(in srgb,var(--hold) 22%,var(--surface))}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.6}}
/* ---- F1: navegación de 5 pestañas, inicio, sesión en curso y cierre ---- */
:root{--navh:0px}
@media (max-width:860px){:root{--navh:calc(68px + env(safe-area-inset-bottom,0px))}}
nav.tabs button{min-height:48px}
nav.bottom{padding-top:4px}
nav.bottom button{min-height:56px;font-size:12px;gap:3px;font-weight:600;border-radius:12px}
nav.bottom svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{background:none;color:var(--accent);font-weight:700}
.wrap.hasbar{padding-block:0 calc(110px + 64px)}
.hhead,.bl-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hhead h1{margin-top:2px}
.gymchip{min-height:48px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:24px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;max-width:55%}
.gymchip svg{width:18px;height:18px;color:var(--accent);flex:none}
.gymchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toca{background:color-mix(in srgb,var(--accent) 78%,#000);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.toca .lbl{font:700 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.toca .tt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.toca .big{font-family:var(--f-display);font-stretch:72%;font-weight:850;font-size:40px;line-height:1;text-transform:uppercase}
.toca p{margin:0;font-size:15px;line-height:1.4;opacity:.92}
.toca .two{display:flex;gap:8px}
.toca .two button{flex:1;min-height:48px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:inherit;font-weight:600;font-size:15px;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wd i{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px var(--f-body);font-style:normal;border:1px dashed var(--line);color:var(--muted);box-sizing:border-box}
.wd i.r{background:var(--accent);color:var(--accent-ink);border:0}
.wd i.g{background:var(--accent-soft);color:var(--accent);border:0}
.wd i.today{border:2px solid var(--accent);color:var(--accent)}
.wd i.r.today,.wd i.g.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.wd.now{color:var(--ink);font-weight:700}
.myproj{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:72px}
.myproj .pm{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;text-align:left;background:none;border:0;cursor:pointer;color:inherit;padding:0}
.myproj .ph2{width:52px;height:52px;border-radius:10px;background:var(--c);flex:none;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.myproj .pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.myproj .pt strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta{position:sticky;bottom:calc(var(--navh) + 10px);display:flex;flex-direction:column;gap:2px;margin-top:18px;padding-top:10px;background:linear-gradient(transparent,var(--bg) 25%)}
.cta .btn.big{min-height:64px;border-radius:18px;font-size:20px;font-weight:700}
.linkbtn{min-height:48px;background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* barra de sesión minimizada */
.livebar{position:fixed;left:max(12px,calc(50% - 378px));right:max(12px,calc(50% - 378px));bottom:calc(var(--navh) + 8px);z-index:35;min-height:56px;border-radius:16px;background:var(--ink);color:var(--bg);border:0;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 14px;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.livebar .dot{width:10px;height:10px;border-radius:50%;background:#6BD46F;flex:none}
.livebar .bt{flex:1;min-width:0;display:flex;flex-direction:column}
.livebar .bt strong{font-size:15px}
.livebar .bt span{font-size:13px;opacity:.75}
.livebar .go{font-weight:700;font-size:15px;color:#6BD46F}
:root[data-theme="dark"] .livebar .go{color:#1B5E20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .livebar .go{color:#1B5E20}}
/* sesión en curso: pantalla completa */
.livel{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.lv-in{width:100%;max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lv-head{background:var(--surface);border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:10px}
.lv-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv-btn{min-height:48px;min-width:48px;display:inline-flex;align-items:center;gap:4px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.lv-btn.first{border-color:transparent;background:none;padding-left:0}
.lv-btn svg{width:20px;height:20px}
.lv-clock{display:flex;flex-direction:column;align-items:center;min-width:0}
.lv-clock strong{font:600 26px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.lv-clock span{font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-sub{display:flex;gap:8px;margin-top:6px}
.lv-rest{flex:1;min-height:48px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;font-size:14px;font-weight:600;color:var(--accent);border:0;cursor:pointer;text-align:left;min-width:0}
.lv-rest strong{font:600 19px var(--f-mono);min-width:68px;flex:none}
.lv-rest .track{flex:1;min-width:8px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.lv-rest .track span{display:block;height:100%;background:var(--accent);width:0}
.lv-rest.done{background:color-mix(in srgb,var(--hold) 35%,var(--surface));color:var(--ink)}

<div id="live" class="livel" hidden></div>
<button id="liveBar" class="livebar" data-act="openLive" aria-label="Volver a la sesión en curso" hidden></button>
<div id="sheet"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/* ================= apariencia: tema y color de acento ================= */
const ACCENTS=[['verde','Verde','#1B5E20','#3E9A4A'],['azul','Azul','#1F4FA3','#5B8DEF'],['morado','Morado','#5B2C9E','#9B7BE0'],['naranja','Naranja','#B4530F','#F0903F'],['rojo','Rojo','#A3262A','#E46A6E'],['grafito','Grafito','#37474F','#90A4AE']];
const APP={accent:'verde'};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function curTheme(){return document.documentElement.dataset.theme||'auto'}
function applyTheme(t){if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function applyAccent(key){
  const a=ACCENTS.find(x=>x[0]===key)||ACCENTS[0];
  APP.accent=a[0];
  let st=document.getElementById('accent-style');
  if(a[0]==='verde'){if(st)st.remove();return}
  if(!st){st=document.createElement('style');st.id='accent-style';(document.body||document.documentElement).appendChild(st)}
  const L=a[2],D=a[3];
  st.textContent=`:root{--accent:${L};--accent-soft:color-mix(in srgb,${L} 18%,#ffffff)}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:${D};--accent-soft:color-mix(in srgb,${D} 22%,#000000)}}:root[data-theme="dark"]{--accent:${D};--accent-soft:color-mix(in srgb,${D} 22%,#000000)}`;
}
(function(){
  let t='auto',a='verde';
  try{t=lsGet('cb-theme')||'auto';a=lsGet('cb-accent')||'verde'}catch(e){}
  applyTheme(t);applyAccent(a);
})();
/* ================= dominio ================= */
const FONT=['4','4+','5','5+','6A','6A+','6B','6B+','6C','6C+','7A','7A+','7B','7B+','7C','7C+','8A','8A+','8B','8B+','8C'];
const gi=g=>FONT.indexOf(g);
const DEFAULT_GYM={id:'principal',nombre:'Mi rocódromo',colores:[
  {n:'Azul',hex:'#2F6FD6',min:'4',max:'5'},{n:'Verde',hex:'#3E9B4F',min:'5+',max:'6A'},{n:'Amarillo',hex:'#E8C31A',min:'6A',max:'6A+'},
  {n:'Naranja',hex:'#EE7A1F',min:'6B',max:'6B+'},{n:'Rojo',hex:'#D3392E',min:'6B+',max:'6C'},{n:'Morado',hex:'#7B4BC4',min:'6C+',max:'7A+'},{n:'Negro',hex:'#1F1F1F',min:'7B',max:'7C'}]};
const ESTILOS=['Regletas','Romos','Pinzas','Agujeros/monos','Desplome','Placa','Vertical','Techo','Dinámico','Compresión','Coordinación','Talón/punta','Diedro/arista'];
const FALLOS=['Fuerza de dedos','Bombeo','Lectura / beta','Pies se salen','Posición de cadera','Coordinación','Tracción / bloqueo','Core / tensión','Miedo / compromiso','Salida','Último movimiento','Piel'];
const ZONAS=[['salida','Salida'],['mitad','Mitad'],['final','Final']];
const ENTRENOS=['Multipresa','Campus','Fuerza (pesas)','Antagonistas','Core','Movilidad','Cardio','Otro'];
const FINGER=['Multipresa','Campus'];
const PRESAS=[['Rosa','#E85A9B'],['Blanco','#F4F4F2'],['Negro','#1F1F1F'],['Gris','#8A8F93'],['Amarillo','#E8C31A'],['Naranja','#EE7A1F'],['Rojo','#D3392E'],['Verde','#3E9B4F'],['Azul','#2F6FD6'],['Morado','#7B4BC4'],['Marrón','#8B5A2B'],['Madera','#C9A46A']];
const presaTxt=b=>b&&b.presas?` · presas ${String(b.presas).toLowerCase()}`:'';
const presaSel=(id,val,attr,ph='Presas…')=>`<select id="${id}" ${attr} aria-label="Color de las presas"><option value="">${ph}</option>${PRESAS.map(([n])=>`<option ${n===val?'selected':''}>${n}</option>`).join('')}</select>`;
const PRESETS=[
  {id:'rep',n:'Repeaters 7/3',work:7,rest:3,reps:6,sets:5,setRest:180},
  {id:'max',n:'Suspensión máxima',work:10,rest:0,reps:1,sets:5,setRest:180},
  {id:'4x4',n:'4×4 en bloque',work:240,rest:0,reps:1,sets:4,setRest:240},
  {id:'des',n:'Descanso 3 min',work:0,rest:180,reps:1,sets:1,setRest:0}];

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const pdate=s=>new Date(s+'T00:00:00');
const daysAgo=s=>Math.round((pdate(today())-pdate(s))/864e5);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const fdate=s=>{const d=pdate(s);return `${DIA[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`};
function monday(s){const d=pdate(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}
function addDays(s,n){const d=pdate(s);d.setDate(d.getDate()+n);return iso(d)}
const uid=()=>Math.random().toString(36).slice(2,10);
const num=(v,d=0)=>{const n=parseFloat(v);return isFinite(n)?n:d};
const clone=o=>JSON.parse(JSON.stringify(o));
function fmtDur(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}:${pad(m)}:${pad(s%60)}`:`${pad(m)}:${pad(s%60)}`}
function toast(msg,act){const t=$('#toast');t.textContent='';const sp=document.createElement('span');sp.textContent=msg;t.append(sp);
  if(act){const b=document.createElement('button');b.type='button';b.className='toastbtn';b.dataset.act=act;b.textContent='Deshacer';t.append(b)}
  t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,act?6000:2800)}
function onColor(hex){const h=String(hex||'#888888').replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (r*299+g*587+b*114)/1000>150?'#1b1b1b':'#ffffff'}
const rango=c=>!c||!c.min?'':c.min===c.max?c.min:`${c.min}–${c.max}`;
const resLabel={flash:'Flash',top:'Top',no:'No'};
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f=880,d=.15,vib=true){try{if(AC){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}}catch(e){}
  if(vib)try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}

/* ================= estado ================= */
const S={db:null,user:null,sample:null,imgCaps:null,noDb:false,noClaude:false,ro:false,err:null,slow:false,
  data:{sesiones:[],entrenos:[],proyectos:[],analisis:[]},cfg:null,cfgLoaded:false,got:new Set(),view:'inicio',period:90,open:{},
  live:null,liveOpen:false,sel:null,bsub:'proj',psub:'res',undo:[],rest:null,wl:null,confirm:null,
  coach:{busy:false,title:'',out:'',ctrl:null,chat:[],saved:false,kind:''}};
const cfg=()=>S.cfg||{rocodromos:[DEFAULT_GYM],principal:DEFAULT_GYM.id,descanso:180,perfil:''};
const gyms=()=>(cfg().rocodromos&&cfg().rocodromos.length)?cfg().rocodromos:[DEFAULT_GYM];
const gym=id=>gyms().find(g=>g.id===id)||gyms().find(g=>g.id===cfg().principal)||gyms()[0];
const mainGym=()=>gym(cfg().principal);
const midC=c=>(gi(c.min)+gi(c.max))/2;
function cidx(b){const g=mainGym(),cs=g.colores;if((b.rocodromoId||g.id)===g.id){const i=cs.findIndex(c=>c.n===b.color);if(i>=0)return i}
  const lv=midC(b);let bi=0,bd=1e9;cs.forEach((c,i)=>{const d=Math.abs(lv-midC(c));if(d<bd){bd=d;bi=i}});return bi}
const sw=(hex,lg)=>`<span class="sw ${lg?'lg':''}" style="--c:${esc(hex)}"></span>`;
const cchip=b=>`<span class="cchip">${sw(b.hex)}${esc(b.color)} <small>${esc(rango(b))}</small></span>`;

/* ================= arranque ================= */
async function init(){
  renderTabs();render();
  const timer=setTimeout(()=>{if(S.got.size<5){S.slow=true;render()}},10000);
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,sample,assets]=await Promise.all([use('db'),use('user'),use('sample'),use('assets')]);S.assets=assets;
  S.db=db;S.user=user;S.sample=sample;S.noClaude=!sample;
  if(sample){try{const l=await sample.limits();S.imgCaps=l.images||null}catch(e){}}
  if(!db){S.noDb=true;clearTimeout(timer);render();return}
  if(user){try{if((await user.canEdit())===false)S.ro=true}catch(e){}}
  const done=c=>{S.got.add(c);if(S.got.size===5){clearTimeout(timer);S.slow=false}};
  db.doc('config/main').onSnapshot(snap=>{S.cfg=snap.exists?snap.data():null;S.cfgLoaded=true;done('config');paintHeader();render()},e=>{S.err=e.code;render()});
  for(const [c,f] of [['sesiones','fecha'],['entrenos','fecha'],['proyectos','createdAt'],['analisis','createdAt']]){
    /* proyectos guarda una ficha por bloque probado: 1000 es el máximo que admite la base de datos */
    db.collection(c).orderBy(f,'desc').limit(c==='proyectos'?1000:500).onSnapshot(snap=>{
      S.data[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(c==='proyectos'){S.proyN=snap.docs.length;splitFusionadas()}
      if(c==='sesiones')syncLive();
      done(c);render();
    },e=>{S.err=e.code;render()});
  }
  setInterval(tick,250);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(S.live||T.running))wake(true)});
}
function paintHeader(){$('#gymName').textContent=mainGym().nombre}
function syncLive(){
  const l=S.data.sesiones.find(s=>s.estado==='en_curso');
  if(l){if(!S.live||S.live.id!==l.id){S.live=clone(l);S.undo=[];wake(true);openLive()}else if(S.live._local)delete S.live._local}
  else if(S.live&&!S.live._local){S.live=null;S.rest=null;S.liveOpen=false;wake(false)}
}
async function wake(on){try{if(on&&!S.wl&&navigator.wakeLock){S.wl=await navigator.wakeLock.request('screen');S.wl.addEventListener?.('release',()=>{S.wl=null})}if(!on&&S.wl){await S.wl.release();S.wl=null}}catch(e){}}

async function dbSave(coll,id,data){
  if(!S.db){toast('No hay conexión con el almacén de datos.');return false}
  try{if(id)await S.db.doc(coll+'/'+id).set(data);else await S.db.collection(coll).add(data);return true}
  catch(e){toast(e.code==='quota_exceeded'?'El almacén está lleno: borra registros antiguos.':'No se pudo guardar ('+(e.code||'error')+'). Inténtalo otra vez.');return false}
}
async function dbUpdate(coll,id,data){try{await S.db.doc(coll+'/'+id).update(data);return true}catch(e){toast('No se pudo actualizar.');return false}}
async function dbDel(coll,id){try{await S.db.doc(coll+'/'+id).delete();return true}catch(e){toast('No se pudo borrar.');return false}}

/* ================= sesión en curso ================= */
let wq=Promise.resolve(),wt=null;
function persistLive(now){
  clearTimeout(wt);
  const go=()=>{const L=S.live;if(!L||!S.db)return;const data={bloques:L.bloques,updatedAt:Date.now()};
    wq=wq.then(()=>S.db.doc('sesiones/'+L.id).update(data)).catch(()=>toast('No se pudo guardar el último cambio. Revisa la conexión.'))};
  if(now)go();else wt=setTimeout(go,400);
}
async function flushLive(){clearTimeout(wt);persistLive(true);try{await wq}catch(e){}}
async function startSession(gid){
  unlockAudio();
  if(!S.db){toast('No hay conexión con el almacén de datos.');return}
  const g=gym(gid),ref=S.db.collection('sesiones').doc();
  const d={fecha:today(),inicio:Date.now(),estado:'en_curso',rocodromoId:g.id,lugar:g.nombre,bloques:[],createdAt:Date.now()};
  S.live={id:ref.id,...d,_local:true};S.undo=[];S.rest=null;S.view='inicio';renderTabs();openLive();wake(true);
  try{await ref.set(d)}catch(e){S.live=null;S.liveOpen=false;popLiveState();toast('No se pudo empezar la sesión. Revisa la conexión.');render()}
}
/* --- la sesión en curso es una pantalla completa; «minimizar» la deja como barra sobre las pestañas.
   Se apunta una entrada en el historial al abrirla: el botón Atrás de Android la minimiza en vez de salir de la app. --- */
function openLive(){S.liveOpen=true;S.sel=null;if(!(history.state&&history.state.live)){try{history.pushState({live:1},'')}catch(e){}}render();window.scrollTo(0,0)}
function popLiveState(){try{if(history.state&&history.state.live){S.ownPop=(S.ownPop||0)+1;clearTimeout(S.ownPopT);S.ownPopT=setTimeout(()=>{S.ownPop=0},500);history.back()}}catch(e){S.ownPop=0}}
function minimizeLive(){if(!S.liveOpen)return;S.liveOpen=false;render();popLiveState()}
/* marca que este Atrás ya lo ha gastado una hoja o la sesión en curso (los demás listeners de popstate lo consultan, vayan antes o después) */
function popUsed(){S.popUsed=true;setTimeout(()=>{S.popUsed=false},0)}
window.addEventListener('popstate',()=>{
  if(S.ownPop>0){S.ownPop--;return}
  if(F&&document.querySelector('.sheet')){popUsed();closeSheet();if(S.liveOpen&&S.live&&!(history.state&&history.state.live)){try{history.pushState({live:1},'')}catch(e){}}return}
  if(S.liveOpen){popUsed();S.liveOpen=false;render()}
});
function snap(){S.lastUndo=0;S.undo.push({b:clone(S.live.bloques),sel:S.sel?{...S.sel}:null});if(S.undo.length>40)S.undo.shift()}
/* selección en el registro: color (índice en la escala) + a qué bloque van los intentos:
   'new' = bloque nuevo, 'f:<id>' = ficha existente, 'b:<id>' = bloque de hoy aún abierto */
function selectColor(i){S.sel=(S.sel&&S.sel.ci===i)?null:{ci:i,tgt:'new'};render()}
function liveChips(ci){
  const L=S.live,g=gym(L.rocodromoId),c=g.colores[ci];if(!c)return [];
  const out=[{id:'new',label:'+ Bloque nuevo'}],used=new Set(),FI=fichaItems();
  for(const b of L.bloques)if(b.color===c.n&&!b.resultado){if(b.proyectoId)used.add(b.proyectoId);out.push({id:'b:'+b.id,label:liveBlockName(L,b)+(b.intentos?` · ${b.intentos} int.`:'')})}
  const last=p=>{const a=FI.get(p.id);return a&&a.length?a[a.length-1].fecha||'':''},ord={activo:0,abandonado:1,encadenado:2};
  S.data.proyectos.filter(p=>!p.fusionadaEn&&p.estado!=='retirado'&&p.color===c.n&&(p.rocodromoId||mainGym().id)===g.id&&!used.has(p.id))
    .sort((a,b)=>(b.principal?1:0)-(a.principal?1:0)||(ord[a.estado]??1)-(ord[b.estado]??1)||last(b).localeCompare(last(a))||(b.createdAt||0)-(a.createdAt||0)).slice(0,12)
    .forEach(p=>out.push({id:'f:'+p.id,label:projName(p),ficha:p}));
  return out}
/* bloque de hoy al que apunta la selección; con create crea uno nuevo si hace falta */
function selBlock(create){
  const sel=S.sel,L=S.live;if(!sel||!L)return null;const g=gym(L.rocodromoId),c=g.colores[sel.ci];if(!c)return null;
  if(sel.tgt.startsWith('b:')){const b=L.bloques.find(x=>x.id===sel.tgt.slice(2));if(b&&!b.resultado)return b;sel.tgt='new'}
  let pid='';
  if(sel.tgt.startsWith('f:')){pid=sel.tgt.slice(2);const ex=L.bloques.find(x=>x.proyectoId===pid&&!x.resultado);if(ex)return ex}
  if(!create)return null;
  const b={id:uid(),color:c.n,hex:c.hex,min:c.min,max:c.max,rocodromoId:g.id,presas:'',resultado:null,intentos:0,caidas:[],estilos:[],fallos:[],nota:'',proyectoId:pid,t:Date.now(),ints:[]};
  if(pid){const p=S.data.proyectos.find(x=>x.id===pid);if(p&&p.presas)b.presas=p.presas}
  L.bloques.push(b);return b}
/* registra un intento: kind 'fall' (Caída) o 'top' (Top; al primer intento de un bloque cuenta como flash) */
function liveAttempt(kind){
  if(!S.live||!S.sel)return;unlockAudio();snap();
  const b=selBlock(true);if(!b){S.undo.pop();return}
  if(!Array.isArray(b.ints))b.ints=[];while(b.ints.length<b.intentos)b.ints.push(0);
  b.intentos++;b.ints.push(Date.now());
  let msg;
  if(kind==='top'){b.resultado=b.intentos===1?'flash':'top';S.sel=null;msg=`${b.color} · ${b.resultado==='flash'?'Flash':'Top'} guardado`}
  else{S.sel.tgt='b:'+b.id;msg=`${b.color} · Caída guardada`}
  startRest();persistLive();render();toast(msg,'liveUndo');
}
function liveUndo(){if(!S.undo.length||Date.now()-(S.lastUndo||0)<400)return;S.lastUndo=Date.now();const u=S.undo.pop();S.live.bloques=u.b;S.sel=u.sel;persistLive();render();toast('Deshecho')}
function startRest(){unlockAudio();S.rest={start:Date.now(),target:num(cfg().descanso,180)*1000,beeped:false}}

function tick(){
  if(S.live){const t=fmtDur(Date.now()-S.live.inicio);for(const id of ['elapsed','barT']){const e=document.getElementById(id);if(e)e.textContent=t}
    const bs=document.getElementById('barSub');if(bs){const n=S.live.bloques.reduce((a,b)=>a+num(b.intentos,0),0);bs.textContent=n+(n===1?' intento':' intentos')+(S.rest?' · descanso '+fmtDur(Date.now()-S.rest.start):'')}}
  if(S.rest){const el=Date.now()-S.rest.start,t=document.getElementById('restT'),b=document.getElementById('restBar'),w=document.getElementById('restWrap');
    if(t)t.textContent=fmtDur(el);if(b)b.style.width=Math.min(100,el/S.rest.target*100)+'%';
    if(el>=S.rest.target){if(w)w.classList.add('done');if(!S.rest.beeped){S.rest.beeped=true;beep(988,.25);setTimeout(()=>beep(988,.25,false),350)}}}
  if(T.running)tTick();
}

/* ================= pestañas ================= */
const ICON={inicio:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',bloques:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
 progreso:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',coach:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 yo:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'};
const TABS=[['inicio','Sesión'],['bloques','Bloques'],['progreso','Progreso'],['coach','Coach'],['yo','Yo']];
const NAV=TABS.map(t=>t[0]);
/* nombres de vistas de v12 -> pestaña + subvista (Memoria y Proyectos viven en Bloques; Registro es el Historial de Progreso) */
const LEGACY={memoria:['bloques','all'],proyectos:['bloques','proj'],registro:['progreso','hist']};
function go(view,sub){S.sesDet=null;const L=LEGACY[view];if(L){view=L[0];sub=sub||L[1]}
  if(view==='bloques'&&sub)S.bsub=sub;if(view==='progreso'&&sub)S.psub=sub;
  S.view=NAV.includes(view)?view:'inicio';renderTabs();render();window.scrollTo(0,0)}
function renderTabs(){const sv=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
  const h=TABS.map(([k,l])=>`<button data-tab="${k}" ${S.view===k?'aria-current="page"':''}>${sv(k)}${l}</button>`).join('');$('#tabsTop').innerHTML=h;$('#tabsBot').innerHTML=h}

/* ================= render ================= */
function render(){
  const main=$('#main'),ci=document.getElementById('chatIn'),keep=ci?{v:ci.value,f:document.activeElement===ci}:null;
  let h='';
  if(S.noDb)h=`<div class="section"><div class="banner">Abre esta página en claude.ai con tu sesión iniciada para poder guardar tus sesiones.</div></div>`;
  else if(S.got.size<5&&!S.err)h=`<div class="section"><p class="muted">${S.slow?'Los datos están tardando más de lo normal; lo que ves puede no estar actualizado.':'Cargando tu cuaderno…'}</p></div>`+(S.slow?views[S.view]():'');
  else h=(S.err?`<div class="section"><div class="banner">No se pudieron cargar los datos (${esc(S.err)}). Recarga la página.</div></div>`:'')+(S.ro?`<div class="section"><div class="banner">Estás viendo este cuaderno en modo lectura.</div></div>`:'')+views[S.view]();
  main.innerHTML=h;paintLive();
  if(keep){const n=document.getElementById('chatIn');if(n){n.value=keep.v;if(keep.f)n.focus()}}
}
const views={};
const ses=()=>S.data.sesiones.filter(s=>s.estado!=='en_curso'),ent=()=>S.data.entrenos;

/* ================= BLOQUES / PROGRESO / YO: pestañas que reúnen las vistas de v12 ================= */
const subSeg=(attr,cur,list,label)=>`<div class="seg" role="group" aria-label="${label}">${list.map(([k,l])=>`<button data-${attr}="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>`;
/* ================= cálculos ================= */
/* ================= métricas de sesión (funciones puras, sin leer S) ================= */
const hm=min=>{min=Math.max(0,Math.round(min||0));return `${Math.floor(min/60)}:${pad(min%60)}`};
const mmss=s=>s==null?'—':`${Math.floor(s/60)}:${pad(Math.round(s%60))}`;
/* intentos de una sesión en orden. Cada bloque guarda `intentos` y, desde F1, `ints`: la hora (ms) de cada intento.
   Los bloques antiguos no tienen `ints`: sus intentos salen con t:null. ci = función que da el índice de color de un bloque. */
function sessionAttempts(s,ci=cidx){
  const out=[];
  for(const b of (s&&s.bloques)||[]){const n=Math.max(0,Math.round(num(b.intentos,0)));
    for(let k=0;k<n;k++){const t=Array.isArray(b.ints)&&num(b.ints[k],0)>0?b.ints[k]:null;
      out.push({color:b.color,hex:b.hex,ci:ci(b),t,top:k===n-1&&(b.resultado==='flash'||b.resultado==='top'),bid:b.id})}}
  if(out.length&&out.every(a=>a.t!==null))out.sort((a,b)=>a.t-b.t);
  return out}
/* nº de intentos iniciales que cuentan como calentamiento (automático).
   Con máximo conocido: intentos consecutivos desde el principio con color >= 2 niveles por debajo de maxIdx.
   Sin máximo (null / -1): los primeros intentos del color más bajo de la sesión, hasta el primer color más alto.
   Si saldría toda la sesión (no hay "parte principal") se devuelve 0. */
function warmupN(A,maxIdx){
  if(!A.length)return 0;
  let n=0;
  if(maxIdx!=null&&maxIdx>=0){while(n<A.length&&A[n].ci<=maxIdx-2)n++}
  else{const lo=Math.min(...A.map(a=>a.ci));while(n<A.length&&A[n].ci===lo)n++}
  return n>=A.length?0:n}
/* Resumen de una sesión. Tiempos de descanso en segundos; minutos en minutos.
   s.calentN (número) fuerza el calentamiento manual. Descanso = hora de un intento menos la del anterior;
   si los intentos no tienen hora (sesiones antiguas) descansoMedio/descansoMax son null. */
function sessionMetrics(s,maxIdx,ci=cidx){
  s=s||{};const A=sessionAttempts(s,ci),N=A.length;
  const bl=(s.bloques||[]).filter(b=>num(b.intentos,0)>0||b.resultado);
  let totalMin=num(s.duracion,0);
  if(!totalMin&&s.inicio)totalMin=Math.max(0,((s.fin||s.now||Date.now())-s.inicio)/60000);
  const tops=bl.filter(b=>b.resultado==='flash'||b.resultado==='top').length;
  const gaps=[],TT=A.filter(a=>a.t!==null).sort((a,b)=>a.t-b.t);for(let i=1;i<TT.length;i++){const g=(TT[i].t-TT[i-1].t)/1000;if(g>0)gaps.push(g)}
  const man=typeof s.calentN==='number'&&isFinite(s.calentN);
  const calentN=man?Math.max(0,Math.min(N,Math.round(s.calentN))):warmupN(A,maxIdx);
  let calentMin=0;
  if(calentN>0){
    if(s.inicio&&A[calentN]&&A[calentN].t!==null)calentMin=(A[calentN].t-s.inicio)/60000;
    else calentMin=N?totalMin*calentN/N:0;
    calentMin=Math.round(Math.max(0,Math.min(totalMin,calentMin)))}
  const principalMin=Math.max(0,Math.round(totalMin)-calentMin);
  const pc=new Map();
  for(const a of A){let e=pc.get(a.color);if(!e){e={color:a.color,hex:a.hex,ci:a.ci,intentos:0,tops:0};pc.set(a.color,e)}e.intentos++;if(a.top)e.tops++}
  return {totalMin:Math.round(totalMin*10)/10,intentos:N,bloques:bl.length,tops,pctTop:N?Math.round(tops/N*100):null,
    descansoMedio:gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null,descansoMax:gaps.length?Math.round(Math.max(...gaps)):null,
    calentMin,calentN,calentManual:man,calentColores:[...new Set(A.slice(0,calentN).map(a=>a.color))],principalMin,
    intentosHora:principalMin>0?Math.round((N-calentN)/(principalMin/60)*10)/10:null,
    porColor:[...pc.values()].sort((a,b)=>b.ci-a.ci)}}
/* carga = minutos × esfuerzo; null si no se anotó esfuerzo */
function sessionLoad(s){const r=num(s&&s.rpe,0);if(!(r>0))return null;const m=sessionMetrics(s,-1).totalMin;return Math.round(m*r)}
/* recomendación de hoy sin IA. sesiones/entrenos = listas de registros; hoy = 'AAAA-MM-DD'. Devuelve {tipo:'roco'|'gym', motivo, diasRoco, diasGym, molestia} */
const DIA_LARGO=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function recomendarHoy(sesiones,entrenos,hoy){
  const dd=f=>Math.round((pdate(hoy)-pdate(f))/864e5),fs=a=>a.map(x=>x.fecha).filter(Boolean).filter(f=>dd(f)>=0).sort();
  const lr=fs(sesiones).pop(),lg=fs(entrenos).pop(),dr=lr?dd(lr):null,dg=lg?dd(lg):null;
  const mol=sesiones.some(s=>s.fecha&&dd(s.fecha)>=0&&dd(s.fecha)<=3&&hayDolor(s.dolor));
  let tipo='roco';
  if(mol||dr===0||dr===1)tipo='gym';
  const p=[];
  p.push(dr===null?'aún sin sesiones de escalada':dr===0?'hoy ya has escalado':dr===1?'escalaste ayer':`${dr} días sin escalar`);
  p.push(mol?'molestia reciente':'sin molestias');
  if(dg!==null)p.push(dg===0?'has hecho gym hoy':dg===1?'el gym fue ayer':dg<7?`el gym fue el ${DIA_LARGO[pdate(lg).getDay()]}`:`el gym fue el ${fdate(lg)}`);
  const motivo=p.join(' · ');
  return {tipo,motivo:motivo.charAt(0).toUpperCase()+motivo.slice(1),diasRoco:dr,diasGym:dg,molestia:mol}}


const isTop=b=>b.resultado==='flash'||b.resultado==='top';
function blocksIn(days){const out=[];for(const s of ses()){if(days&&daysAgo(s.fecha)>=days)continue;for(const b of (s.bloques||[]))if(b.resultado)out.push({...b,fecha:s.fecha,sesionId:s.id,rocodromoId:b.rocodromoId||s.rocodromoId})}return out}
function workingIdx(){const t=blocksIn(60).filter(isTop).map(cidx).sort((a,b)=>b-a).slice(0,5);return t.length?t[Math.floor(t.length/2)]:null}
function maxIdx(days){const t=blocksIn(days).filter(isTop).map(cidx);return t.length?Math.max(...t):-1}
const loadOf=x=>num(x.duracion)*num(x.rpe);
function loadStats(){
  const t=today(),daily={};for(const x of [...ses(),...ent()]){if(x.fecha)daily[x.fecha]=(daily[x.fecha]||0)+loadOf(x)}
  const sum=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=daily[addDays(t,-i)]||0;return s};
  const acute=sum(0,7),chronic=sum(0,28)/4,all=[...ses(),...ent()].map(x=>x.fecha).filter(Boolean).sort(),history=all.length?daysAgo(all[0]):0;
  const weeks=[];for(let w=7;w>=0;w--){const m=addDays(monday(t),-7*w);let v=0;for(let i=0;i<7;i++)v+=daily[addDays(m,i)]||0;weeks.push({m,v})}
  const fd=new Set();for(const s of ses())if(daysAgo(s.fecha)<7)fd.add(s.fecha);for(const e of ent())if(daysAgo(e.fecha)<7&&FINGER.includes(e.tipo))fd.add(e.fecha);
  const active=new Set(all);let streak=0,d=active.has(t)?t:addDays(t,-1);while(active.has(d)){streak++;d=addDays(d,-1)}
  return {acute,chronic,history,weeks,fingerDays:fd.size,streak};
}
/* Avisos de recuperación (sustituyen al ratio agudo:crónico, no validado en escalada). Pura: no lee S ni la fecha del sistema. */
const hayDolor=t=>{const v=String(t||'').trim().toLowerCase().replace(/[.!]+$/,'');return !!v&&!/^(no|nada|ninguno|ninguna|-|ok|bien|sin dolor)$/.test(v)};
function recoveryAlerts(sesiones,entrenos,hoy,perfil){
  sesiones=(sesiones||[]).filter(s=>s&&s.fecha);entrenos=(entrenos||[]).filter(e=>e&&e.fecha);
  const ago=f=>Math.round((pdate(hoy)-pdate(f))/864e5),out=[],byDesc=(a,b)=>b.fecha.localeCompare(a.fecha);
  for(const s of sesiones.filter(s=>hayDolor(s.dolor)&&ago(s.fecha)>=0&&ago(s.fecha)<14).sort(byDesc).slice(0,3))
    out.push({nivel:'alto',texto:`Anotaste dolor el ${fdate(s.fecha)}: ${String(s.dolor).trim()}. Baja la carga en esa zona y, si sigue más de una semana, consulta a un fisioterapeuta.`});
  const fd=new Set([...sesiones,...entrenos.filter(e=>FINGER.includes(e.tipo))].map(x=>x.fecha).filter(f=>ago(f)>=0&&ago(f)<7));
  const pair=[...fd].sort().reverse().find(f=>fd.has(addDays(f,-1)));
  if(pair)out.push({nivel:'atencion',texto:`Has trabajado dedos dos días seguidos (${fdate(addDays(pair,-1))} y ${fdate(pair)}). Deja al menos 48 horas entre sesiones duras.`});
  const bad4=sesiones.filter(s=>ago(s.fecha)>=0).sort(byDesc).slice(0,4).filter(s=>num(s.sueno)>0&&num(s.sueno)<=2).length;
  if(bad4>=2)out.push({nivel:'atencion',texto:`Has dormido mal en ${bad4} de tus últimas 4 sesiones. Rendirás menos y te lesionas más fácil: si puedes, cambia el día duro.`});
  for(const s of sesiones.filter(s=>num(s.piel)>0&&num(s.piel)<=2&&ago(s.fecha)>=0&&ago(s.fecha)<7).sort(byDesc))
    out.push({nivel:'info',texto:`Piel baja en la sesión del ${fdate(s.fecha)}: lija callos y dale un día.`});
  const all=[...sesiones,...entrenos],cur=monday(hoy),wk={};
  for(const x of all)if(x.fecha<cur){const m=monday(x.fecha);wk[m]=(wk[m]||0)+num(x.duracion)*num(x.rpe)}
  const ms=Object.keys(wk).sort();let run=0;
  if(ms.length){const first=ms[0],list=[];for(let m=first;m<cur;m=addDays(m,7))list.push({m,v:wk[m]||0});
    const rest=list.map((w,i)=>{const prev=list.slice(0,i).filter(p=>p.v>0).slice(-4);
      return w.v===0||(prev.length>0&&w.v<=0.6*prev.reduce((a,p)=>a+p.v,0)/prev.length)});
    for(let i=list.length-1;i>=0&&!rest[i];i--)run++}
  if(run>=3)out.push({nivel:'info',texto:`Llevas ${run} semanas seguidas sin una semana de descarga. Cada 3 o 4 semanas conviene bajar el volumen un 40–60 %.`});
  const les=perfil&&perfil.lesiones,hasLes=Array.isArray(les)?les.length>0:!!String(les||'').trim();
  if(hasLes&&out.some(a=>a.nivel!=='info'))out.push({nivel:'info',texto:'Tienes anotadas lesiones previas: ante cualquier molestia, mejor parar a tiempo.'});
  const ord={alto:0,atencion:1,info:2};return out.map((a,i)=>({a,i})).sort((x,y)=>ord[x.a.nivel]-ord[y.a.nivel]||x.i-y.i).map(x=>x.a)}
const alertList=al=>`<ul class="alerts">${al.map(a=>`<li${a.nivel==='alto'?' class="b"':a.nivel==='atencion'?' class="w"':''}>${esc(a.texto)}</li>`).join('')}</ul>`;
/* ================= diagnóstico de fallos (reglas, sin IA) ================= */
const DIAG_SUG={
  'Fuerza de dedos':'Suspensiones en multipresa (repeaters 7/3) dos días por semana, nunca dos días seguidos.',
  'Bombeo':'4×4 en bloques dos grados por debajo de tu nivel, una vez por semana.',
  'Lectura / beta':'Antes de cada intento, lee el bloque entero y visualiza la secuencia desde el suelo.',
  'Pies se salen':'Pies silenciosos: 10 minutos en bloques fáciles apoyando los pies sin hacer ruido.',
  'Posición de cadera':'Bloques de placa y vertical buscando pegar la cadera a la pared en cada movimiento.',
  'Coordinación':'Bloques dinámicos fáciles y lances cortos al final del calentamiento.',
  'Tracción / bloqueo':'Dominadas y bloqueos a 90° en el gimnasio, dos veces por semana.',
  'Core / tensión':'Elevaciones de piernas colgado y bloques de desplome manteniendo los pies en la pared.',
  'Miedo / compromiso':'Practica caídas controladas desde poca altura y repite bloques fáciles comprometidos.',
  'Salida':'Repite solo la salida 3 o 4 veces antes de intentar el bloque entero.',
  'Último movimiento':'Trabaja el bloque por secciones empezando por el final, para llegar sabiendo el último paso.',
  'Piel':'Lija los callos, hidrata la piel después de escalar y deja un día de descanso.'};
const DIAG_ZONA={salida:DIAG_SUG['Salida'],final:DIAG_SUG['Último movimiento'],mitad:'Encadena el bloque por mitades y luego únelas.'};
const DIAG_MIN=5;
/* blocks: bloques con resultado (como los de blocksIn). Devuelve hasta 3 hallazgos [{texto,sugerencia,n}] por relevancia.
   Relevancia = intensidad del patrón x raíz del tamaño de muestra. Con menos de DIAG_MIN datos en la celda no se dice nada. */
function diagnose(blocks){
  const bl=(blocks||[]).filter(b=>b&&b.resultado),N=bl.length;if(!N)return [];
  const pc=x=>Math.round(x*100),cand=[],media=bl.filter(isTop).length/N;
  const byT={};for(const b of bl)for(const t of new Set(b.estilos||[]))(byT[t]=byT[t]||[]).push(b);
  const dominante=arr=>{const nf=arr.filter(b=>b.resultado!=='flash'&&(b.fallos||[]).length);if(nf.length<3)return null;
    const c={};for(const b of nf)for(const f of new Set(b.fallos))if(DIAG_SUG[f])c[f]=(c[f]||0)+1;
    const e=Object.entries(c).sort((x,y)=>y[1]-x[1]||FALLOS.indexOf(x[0])-FALLOS.indexOf(y[0]))[0];return e&&e[1]/nf.length>=0.3?e[0]:null};
  const zonas=arr=>{const z={salida:0,mitad:0,final:0};for(const b of arr)for(const k of (b.caidas||[]))if(k in z)z[k]++;return z};
  const topZona=z=>Object.entries(z).sort((x,y)=>y[1]-x[1])[0];
  for(const [t,arr] of Object.entries(byT)){const n=arr.length,tl=t.toLowerCase();
    if(n>=DIAG_MIN){const a=arr.filter(isTop).length,r=a/n;
      if(media-r>=0.15-1e-9){const dm=dominante(arr);
        cand.push({texto:`En ${tl} encadenas el ${pc(r)} % (${a} de ${n}), frente a tu media del ${pc(media)} %.`,
          sugerencia:dm?DIAG_SUG[dm]:`Dedica la primera media hora de la próxima sesión a bloques de ${tl} de un grado por debajo de tu nivel.`,n,score:(media-r)*Math.sqrt(n)})}}
    const z=zonas(arr),tot=z.salida+z.mitad+z.final;
    if(tot>=DIAG_MIN){const [zk,zv]=topZona(z);
      if(zv/tot>=0.5)cand.push({texto:`En ${tl}, el ${pc(zv/tot)} % de tus caídas son en ${zk} (${zv} de ${tot}).`,sugerencia:DIAG_ZONA[zk],n:tot,score:(zv/tot-0.25)*Math.sqrt(tot)})}}
  const nf=bl.filter(b=>b.resultado!=='flash'&&(b.fallos||[]).length);
  if(nf.length>=DIAG_MIN){const c={};for(const b of nf)for(const f of new Set(b.fallos))if(DIAG_SUG[f])c[f]=(c[f]||0)+1;
    const e=Object.entries(c).sort((x,y)=>y[1]-x[1]||FALLOS.indexOf(x[0])-FALLOS.indexOf(y[0]))[0];
    if(e&&e[1]/nf.length>=0.3)cand.push({texto:`El motivo que más se repite es ${e[0].toLowerCase()}: aparece en ${e[1]} de ${nf.length} bloques que no salieron a la primera.`,sugerencia:DIAG_SUG[e[0]],n:nf.length,score:e[1]/nf.length*Math.sqrt(nf.length)})}
  const z=zonas(bl),tot=z.salida+z.mitad+z.final;
  if(tot>=DIAG_MIN){const [zk,zv]=topZona(z);
    if((zk==='salida'||zk==='final')&&zv/tot>=0.5)cand.push({texto:`El ${pc(zv/tot)} % de tus caídas son en ${zk==='salida'?'la salida':'el final'} (${zv} de ${tot}).`,sugerencia:DIAG_ZONA[zk],n:tot,score:(zv/tot-0.25)*Math.sqrt(tot)})}
  cand.sort((x,y)=>y.score-x.score);
  const seen=new Set(),out=[];for(const c of cand){if(seen.has(c.sugerencia))continue;seen.add(c.sugerencia);out.push({texto:c.texto,sugerencia:c.sugerencia,n:c.n});if(out.length===3)break}
  return out}
function diagSection(bl){
  const D=diagnose(bl);
  return `<div class="section"><div class="sechead"><h2>Diagnóstico</h2><span class="eyebrow">calculado con tus datos</span></div><div class="panel stack">${D.length?D.map(x=>`<div class="dg"><div class="dt">${esc(x.texto)}</div><div class="ds">${esc(x.sugerencia)}</div></div>`).join(''):'<div class="muted">Aún no hay datos suficientes. Etiqueta el tipo de bloque y por qué fallas al cerrar la sesión: con unas 5 sesiones empieza a salir el diagnóstico.</div>'}</div></div>`}
function weakness(days){
  let bl=blocksIn(days);const w=workingIdx();let scoped=false;
  if(w!==null){const near=bl.filter(b=>cidx(b)>=w-1);if(near.length>=12){bl=near;scoped=true}}
  const overall=bl.length?bl.filter(isTop).length/bl.length:0,st={};
  for(const b of bl)for(const t of (b.estilos||[])){st[t]=st[t]||{n:0,s:0,a:0};st[t].n++;if(isTop(b))st[t].s++;st[t].a+=num(b.intentos,1)}
  const styles=Object.entries(st).filter(([,v])=>v.n>=3).map(([k,v])=>({k,n:v.n,rate:v.s/v.n,att:v.a/v.n})).sort((a,b)=>a.rate-b.rate);
  const fc={};for(const b of bl)if(b.resultado!=='flash')for(const f of (b.fallos||[]))fc[f]=(fc[f]||0)+1;
  const zc={salida:0,mitad:0,final:0};for(const b of bl)for(const z of (b.caidas||[]))if(z in zc)zc[z]++;
  return {n:bl.length,overall,styles,fails:Object.entries(fc).sort((a,b)=>b[1]-a[1]),zonas:zc,scoped,w};
}
